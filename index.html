      const st=pps.some(p=>p[k]&&p[k].st==='off')?'off':pps.every(p=>p[k]&&p[k].st==='ok')?'ok':'missing';
      if(st==='ok'){ add('ok',lab+' is in the expected range for the gross pay'); pts+=5; }
      else if(st==='off'){ off=true; add('warn',lab+' is outside the expected range'); }
      else add('warn','No '+lab.toLowerCase()+' found on the payslip'); });
    const nr=ps.map(d=>nameMatch(app,d.f.employee)); if(nr.some(x=>x==='mismatch')){ hard=true; add('bad','Name on the payslip does not match the application'); } else if(nr.every(x=>x==='match')){ add('ok','Name on the payslip matches the application'); pts+=10; } else if(nr.some(x=>x==='partial')){ add('warn','Name on the payslip only partly matches'); pts+=4; } else add('todo','Name on the payslip not compared');
    if(lt){ const same=orgSame(lt.f.employer,ps[0].f.employer); if(same===false){ hard=true; add('bad','Employer on the letter differs from the payslip'); } else if(same===true){ add('ok','Employer name agrees on the letter and the payslip'); pts+=10; } }
    const srt=ps.filter(d=>d.f.payDate&&d.f.ytd&&d.f.gross).sort((a,b)=>a.f.payDate<b.f.payDate?-1:1);
    if(srt.length>=2){ let good=true; for(let i=1;i<srt.length;i++){ const gap=Math.round((new Date(srt[i].f.payDate)-new Date(srt[i-1].f.payDate))/86400000); const n=PERIODS[srt[i].f.freq]||26; if(Math.abs(gap-365/n)<=4){ const diff=srt[i].f.ytd-srt[i-1].f.ytd; if(Math.abs(diff-srt[i].f.gross)/srt[i].f.gross>0.03) good=false; } }
      add(good?'ok':'warn',good?'Year-to-date grows by one pay period between consecutive payslips':'Year-to-date does not grow by one pay period between payslips'); if(good) pts+=5; }
    if(bk&&bk.f.payroll&&bk.f.payroll.length){ const nets=ps.map(d=>d.f.net).filter(Boolean); const hit=nets.some(n=>bk.f.payroll.some(p=>Math.abs(p.amt-n)/n<0.03)); add(hit?'ok':'warn',hit?'A payslip net amount matches a payroll deposit on the bank statement':'No bank deposit matches a payslip net amount'); if(hit) pts+=5; }
    const lowDocs=ps.concat(lt?[lt]:[]).filter(d=>docLow(s,d)); if(lowDocs.length&&!dimAccepted(s,'employment')) add('warn','A document was read with low confidence: verify it manually first'); else { add('ok','Documents were read with enough confidence'); pts+=5; }
  }
  if(web){ if(web.level==='found'){ add('ok','Employer found online (match score '+web.score+'/100)'); pts+=40; } else if(web.level==='weak'){ add('warn','Only weak evidence of the employer online (match score '+web.score+'/100)'); pts+=18; } else add('warn','Employer not found online'+(web.error?' ('+web.error+')':'')+' (match score '+web.score+'/100)');
    if(web.rows.some(r=>r.nameHit&&r.cityHit)) add('ok','The search results place the employer in '+(inp.city||'the stated city')); else if(inp.city) add('warn','No result confirmed the employer in '+inp.city);
    if(inp.phone){ if(web.rows.some(r=>r.phoneHit)) add('ok','The phone number on the letter appears in the search results'); else add('warn','The phone number on the letter did not appear in the search results'); } }

}

  const m=/[#&]rr=([^&]+)/.exec(location.hash||''); if(!m) return;

    const req=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if(!req||req.type!=='rentroll.screeningRequest'||req.version!==1||!req.requestId||!req.criteria) throw new Error('bad request');
    let s=data.screenings.find(x=>x.source&&x.source.requestId===req.requestId);
    if(!s){
      s=blankScreening();
      s.applicant={name:(req.applicant&&req.applicant.name)||'',email:(req.applicant&&req.applicant.email)||'',phone:(req.applicant&&req.applicant.phone)||'',address:''};
      s.rental={property:(req.rental&&req.rental.property)||'',rent:(req.rental&&req.rental.rent!==''&&req.rental.rent!=null)?String(req.rental.rent):'',moveIn:''};
      s.criteria={minCredit:Number(req.criteria.minCredit),refRequired:!!req.criteria.refRequired,lockedAt:req.criteria.lockedAt};
      s.source={requestId:req.requestId,applicantId:req.applicantId,unitId:req.unitId,criteriaVersionId:req.criteriaVersionId,criteriaVersion:req.criteria.version};
      data.screenings.unshift(s);
    }
    ui={view:'edit',id:s.id,confirmDelete:null}; save();
    history.replaceState(null,'',location.pathname+location.search);
    setTimeout(()=>toast('Opened from Rent Roll. Criteria are already locked.'),400);
  }catch(e){ setTimeout(()=>toast('Could not read the request from Rent Roll.'),400); }
}
function buildRentRollPackage(s){
  const e=evaluate(s); const checks={}; DIMS.forEach(d=>{ checks[d.key]=dimStatus(s,d.key); });
  return {type:'rentroll.screeningResult',version:1,ref:s.id.toUpperCase(),exportedAt:nowISO(),createdAt:s.createdAt,decidedAt:nowISO(),
    source:s.source?{requestId:s.source.requestId,applicantId:s.source.applicantId,unitId:s.source.unitId,criteriaVersionId:s.source.criteriaVersionId}:null,
    applicant:{name:s.applicant.name,email:s.applicant.email,phone:s.applicant.phone,address:s.applicant.address},
    rental:{property:s.rental.property,rent:s.rental.rent,moveIn:s.rental.moveIn},
    criteria:{minCredit:Number(s.criteria.minCredit),refRequired:!!s.criteria.refRequired,lockedAt:s.criteria.lockedAt},
    consents:s.consents||{},
    report:{creditScore:(s.credit.score===''||s.credit.score==null)?null:Number(s.credit.score),income:(s.income.monthly===''||s.income.monthly==null)?null:Number(s.income.monthly),incomeSufficient:s.income.sufficient||'',r2i:r2i(s),refOutcome:checks.references,checks},
    authenticity:s.docCheck?{tier:s.docCheck.tier,sha256:s.docCheck.sha256,fileName:s.docCheck.fileName}:null,
    attested:!!(s.attestation&&s.attestation.given),
    verifiedAtSource:isSourceVerified(s)?s.sourceVerified.method:null,
    ltb:s.ltbAuto?{flagged:!!s.ltbAuto.flagged,summary:s.ltbAuto.summary,total:s.ltbAuto.total}:null,
    outcome:{computed:e.computed,final:e.final,overridden:e.overridden,reasons:e.reasons,flags:e.flags,missing:e.missing,justification:e.overridden?s.override.justification:''},
    documents:(s.docs||[]).map(d=>({type:d.type,sha256:d.sha256,read:d.method,confidence:docScore(s,d),edited:Object.keys(d.over||{})})),manualVerification:s.manual||{},employmentVerification:{method:(s.checks&&s.checks.employment&&s.checks.employment.prelim)?'preliminary':((s.docConfirm&&s.docConfirm.employer)?'direct':null),prelimResult:s.prelim?s.prelim.result:null,prelimScore:s.prelim?s.prelim.score:null},applicantResponse:s.applicantResponse||''};
}
function canSendToRentRoll(s){ try{ return !!(window.opener && !window.opener.closed && s.source); }catch(e){ return false; } }
function sendToRentRoll(){
  const s=cur(); if(!s) return; const e=evaluate(s);
  if(e.final==='incomplete'){ toast('Finish the screening first'); return; }
  if(!canSendToRentRoll(s)){ downloadResultFile(); return; }
  const pkg=buildRentRollPackage(s);
  try{ window.opener.postMessage({type:'rentroll.screeningResult',payload:pkg},'*'); s.sentAt=nowISO(); s.ackAt=null; s.updatedAt=nowISO(); save(); render(); toast('Sent. Rent Roll will confirm.'); }
  catch(err){ downloadResultFile(); }
}
function downloadResultFile(){
  const s=cur(); if(!s) return; const e=evaluate(s);
  if(e.final==='incomplete'){ toast('Finish the screening first'); return; }
  const pkg=buildRentRollPackage(s);
  const nm=(s.applicant.name||'applicant').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'})); a.download='screening-result-'+nm+'-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  s.downloadedAt=nowISO(); s.updatedAt=nowISO(); save(); render(); toast('Result file downloaded. Import it in Rent Roll (Screening tab).');
}
function rrPanelHtml(s){
  const e=evaluate(s); const ok=e.final!=='incomplete'; const link=canSendToRentRoll(s);
  return `<div class="panel"><div class="sec-no">6 · Rent Roll</div><h3>Send the result to Rent Roll</h3>
    <p class="hint">Sends the outcome, score, check results and consents. The credit PDF, your notes and the PDF report stay in this tool.</p>
    ${s.source?`<p class="hint">Linked to a Rent Roll applicant (criteria v${esc(s.source.criteriaVersion)}).</p>`:`<p class="hint">Not opened from Rent Roll, so this downloads a file. In Rent Roll, open the Screening tab and choose "Import a screening result".</p>`}
    ${ok?'':`<div class="note">Finish the screening first${e.missing.length?': '+esc(e.missing.join(', ')):''}.</div>`}
    <div class="actions noprint"><button class="primary" ${ok?'':'disabled'} onclick="sendToRentRoll()">${link?'Send to Rent Roll':'Download result file'}</button>${link?`<button ${ok?'':'disabled'} onclick="downloadResultFile()">Download file instead</button>`:''}</div>
    ${s.ackAt?`<p class="hint">Rent Roll confirmed it received this on ${esc(fmtDT(s.ackAt))}.</p>`:(s.sentAt?`<p class="hint">Sent ${esc(fmtDT(s.sentAt))}. Waiting for Rent Roll to confirm. If nothing happens, use "Download file instead".</p>`:(s.downloadedAt?`<p class="hint">File downloaded ${esc(fmtDT(s.downloadedAt))}.</p>`:''))}
    ${e.final==='review'?'<div class="note">Flagged for review. Rent Roll will bring it in undecided so you choose pass or fail there, or record your own decision above first.</div>':''}</div>`;
}
if(typeof window.addEventListener==='function'){
  window.addEventListener('message',ev=>{
    const d=ev.data; if(!d||d.type!=='rentroll.ack') return;
    if(window.opener&&ev.source!==window.opener) return;
    const s=data.screenings.find(x=>x.id.toUpperCase()===d.ref); if(!s) return;
    if(d.ok){ s.ackAt=nowISO(); save(); render(); toast('Rent Roll confirmed it received the result.'); }
    else toast('Rent Roll could not import it: '+(d.message||'unknown reason'));
  });
}

  Object.keys(D).forEach(k=>{ if(!(k in ag)) ag[k]=D[k]; });
  ag[field]=val; s.updatedAt=nowISO(); save(); refreshAgreementLive();
}
function refreshAgreementLive(){

        ${ag.additionalTenants?(ag.additionalTenants.split('\n').filter(n=>n.trim()).map(n=>`<div style="margin-top:10px"><div class="sec-no">Additional tenant</div><div style="border-bottom:1px solid var(--ink);height:48px;margin:10px 0 4px"></div><div style="font-size:13px">${esc(n.trim())}</div><div style="font-size:12px;color:var(--muted)">Date: ____________________</div></div>`).join('')):''}
      </div>
    </div>

    <div class="note" style="margin-top:24px">This tool generates a draft based on Form 2229E (Ontario Standard Lease, December 2020, O. Reg. 9/18 under the <i>Residential Tenancies Act, 2006</i>). It does not constitute legal advice. Both parties must sign and each must receive a copy. Official blank form: <a href="https://forms.mgcs.gov.on.ca/en/dataset/047-2229" target="_blank" rel="noopener noreferrer">forms.mgcs.gov.on.ca/en/dataset/047-2229</a></div>
    <div class="actions noprint" style="margin-top:16px;align-items:center;flex-wrap:wrap;gap:8px">
      <button class="primary" onclick="downloadLeasePdf()">${ag.generatedAt?'Re-generate PDF':'Generate PDF'} (Form 2229E)</button>
      ${ag.generatedAt?`<button onclick="window.print()">Print</button>`:''}
      ${ag.generatedAt?`<span style="font-size:12px;color:var(--muted)">Last generated ${esc(fmtDT(ag.generatedAt))}</span>`:''}
    </div>
  </div>`;
  refreshAgreementLive();
}

function buildLeasePdf(){
  const s=cur(); if(!s) return null;
  const ag=s.agreement||{}; const o=data.owner; const a=s.applicant; const r=s.rental;
  const J=window.jspdf&&window.jspdf.jsPDF; if(!J) return null;
  const doc=new J({unit:'pt',format:'letter'});

  // Page geometry
  const W=612, H=792, ML=40, MR=40, MT=20, MB=30, CW=W-ML-MR;
  // Spacing constants
  const FBP=4;    // inner horizontal padding inside a form box
  const FBT=8;    // top padding — label baseline
  const FBV=20;   // value baseline offset from box top (first line)
  const FBLH=11;  // value line-height
  const FBB=6;    // bottom padding inside box (clearance below last line)
  const FBG=8;    // gap below a form-box row
  const CBH=16;   // checkbox row height (single line)
  const SHH=18;   // section header bar height
  const SHG=10;   // gap below section header before content
  const NLH=10;   // note line-height
  const NG=4;     // extra gap after a note block
  let y=MT;

  // Palette
  const NAVY=[0,51,102], BLUE=[0,84,166], LTBLUE=[220,234,248],
        GRAY=[110,110,110], FGRAY=[248,248,248], BLACK=[25,25,25],
        WHITE=[255,255,255], BORDER=[185,185,185], DBORDER=[140,140,140];

  // Page-break guard — always call BEFORE drawing a block of height h
  const need=h=>{ if(y+h>H-MB-8){ doc.addPage(); y=MT; } };

  function sf(f,st,sz,col){
    doc.setFont(f||'helvetica',st||'normal'); doc.setFontSize(sz||10);
    doc.setTextColor.apply(doc,col||BLACK);
  }

  // Compute how tall a form-box needs to be given its label+value content.
  // Returns height (never less than minH).
  function fbHeight(lbl,val,bw,minH){
    minH=minH||26;
    // label is always 1 line (6.5pt, fits in FBT)
    const vLines=doc.splitTextToSize(pdfClean(val||''),bw-FBP*2).length;
    return Math.max(minH, FBV + (vLines-1)*FBLH + FBB);
  }

  // Draw a labelled form-field box. Height auto-computed unless bh is given.
  // Always advances y to by+bh+FBG after drawing (caller sets y=by first via need).
  function fb(lbl,val,bx,by,bw,bh){
    if(!bh) bh=fbHeight(lbl,val,bw);
    doc.setFillColor.apply(doc,FGRAY); doc.setDrawColor.apply(doc,BORDER);
    doc.setLineWidth(0.4); doc.rect(bx,by,bw,bh,'FD');
    sf('helvetica','normal',6.5,GRAY);
    doc.text(pdfClean(lbl),bx+FBP,by+FBT);
    sf('helvetica','normal',9.5,BLACK);
    doc.splitTextToSize(pdfClean(val||''),bw-FBP*2).forEach((l,i)=>doc.text(l,bx+FBP,by+FBV+i*FBLH));
    y=by+bh+FBG;
  }

  // Row of N equally-spaced boxes. All boxes in the row share the same height
  // (the tallest computed height among them) so they align perfectly.
  function fbRow(cols,_by,minH){
    const gap=5; const n=cols.length; const bw=(CW-(n-1)*gap)/n;
    const rowH=cols.reduce((m,[lbl,val])=>Math.max(m,fbHeight(lbl,val,bw,minH||26)),26);
    need(rowH+FBG);
    const ry=y; // use y AFTER need() in case a page break reset it
    cols.forEach(([lbl,val],i)=>{
      const bx=ML+i*(bw+gap);
      doc.setFillColor.apply(doc,FGRAY); doc.setDrawColor.apply(doc,BORDER);
      doc.setLineWidth(0.4); doc.rect(bx,ry,bw,rowH,'FD');
      sf('helvetica','normal',6.5,GRAY); doc.text(pdfClean(lbl),bx+FBP,ry+FBT);
      sf('helvetica','normal',9.5,BLACK);
      doc.splitTextToSize(pdfClean(val||''),bw-FBP*2).forEach((l,j)=>doc.text(l,bx+FBP,ry+FBV+j*FBLH));
    });
    y=ry+rowH+FBG;
  }

  // Checkbox row. Handles label text that wraps (cy is the first-line baseline).
  // Returns total height consumed so caller can accumulate y.
  function chk(cx,_cy,ticked,lbl){
    const lblLines=doc.splitTextToSize(pdfClean(lbl),CW-16);
    need(lblLines.length*CBH+2);
    const cy=y; // use y AFTER need() in case a page break reset it
    doc.setFillColor.apply(doc,WHITE); doc.setDrawColor.apply(doc,DBORDER);
    doc.setLineWidth(0.5); doc.rect(cx,cy-8,9,9,'FD');
    if(ticked){ doc.setDrawColor.apply(doc,NAVY); doc.setLineWidth(1.5);
      doc.line(cx+1.5,cy-3.5,cx+3.5,cy-1.5); doc.line(cx+3.5,cy-1.5,cx+8,cy-7.5); }
    sf('helvetica','normal',9,BLACK);
    lblLines.forEach((l,i)=>doc.text(l,cx+13,cy+i*CBH));
    return lblLines.length*CBH;
  }

  // Section header — navy bar, blue number badge, white title
  function sh(num,title){
    need(SHH+SHG+30); y+=8;
    doc.setFillColor.apply(doc,NAVY); doc.rect(ML,y,CW,SHH,'F');
    doc.setFillColor.apply(doc,BLUE); doc.rect(ML,y,22,SHH,'F');
    sf('helvetica','bold',9,WHITE); doc.text(String(num),ML+11,y+SHH-4,{align:'center'});
    sf('helvetica','bold',8.5,WHITE); doc.text(pdfClean(title),ML+28,y+SHH-4);
    y+=SHH+SHG;
  }

  // Statutory note — gray italic, wraps to available width, page-safe
  function note(str,indent){
    const x=ML+(indent||0); const w=CW-(indent||0);
    sf('helvetica','italic',7.5,GRAY);
    doc.splitTextToSize(pdfClean(str),w).forEach(l=>{ need(NLH+2); doc.text(l,x,y); y+=NLH; });
    y+=NG;
  }

  // ── COVER HEADER ──────────────────────────────────────────────
  doc.setFillColor.apply(doc,NAVY);  doc.rect(0,0,W,10,'F');
  doc.setFillColor.apply(doc,BLUE);  doc.rect(0,10,W,3,'F');
  y=22;

  // Title block
  const TH=82;
  doc.setFillColor.apply(doc,LTBLUE); doc.setDrawColor.apply(doc,NAVY);
  doc.setLineWidth(0.8); doc.rect(ML,y,CW,TH,'FD');
  // Ontario label
  sf('helvetica','bold',8.5,NAVY); doc.text('ONTARIO',ML+8,y+14);
  sf('helvetica','normal',7,GRAY);  doc.text('Government of Ontario',ML+8,y+23);
  doc.setDrawColor.apply(doc,BORDER); doc.setLineWidth(0.3); doc.line(ML+76,y+5,ML+76,y+TH-5);
  // Centre title
  const cx=ML+76+(CW-76)/2;
  sf('helvetica','bold',17,NAVY);  doc.text('Standard Form of Lease',cx,y+22,{align:'center'});
  sf('helvetica','normal',9,BLACK);doc.text('(Residential Tenancy Agreement)',cx,y+36,{align:'center'});
  sf('helvetica','normal',7.5,GRAY);
  doc.text('Residential Tenancies Act, 2006  |  Ontario Regulation 9/18',cx,y+50,{align:'center'});
  doc.text('Form 2229E  —  December 2020',cx,y+61,{align:'center'});
  // Right: meta
  sf('helvetica','normal',7,GRAY);
  doc.text(pdfClean('Prepared: '+fmtDate(nowISO())),W-MR-4,y+14,{align:'right'});
  doc.text(pdfClean('Ref: '+s.id.toUpperCase()),W-MR-4,y+24,{align:'right'});
  y+=TH+10;

  // Preamble box
  const preamble='This standard lease is required for most private residential tenancies in Ontario entered into on or after April 30, 2018. '+
    'If a landlord and tenant agree to additional rules or terms, they must not contradict or take away any right or responsibility under the '+
    'Residential Tenancies Act, 2006. Landlords must provide a copy of the signed lease within 21 days.';
  const pLines=doc.splitTextToSize(pdfClean(preamble),CW-14);
  const pH=pLines.length*9+18;
  doc.setFillColor(250,250,246); doc.setDrawColor.apply(doc,BORDER); doc.setLineWidth(0.4);
  doc.rect(ML,y,CW,pH,'FD');
  sf('helvetica','bold',8,NAVY); doc.text('About this Lease',ML+6,y+10);
  sf('helvetica','normal',7.5,GRAY); pLines.forEach((l,i)=>doc.text(l,ML+6,y+20+i*9));
  y+=pH+12;

  // ── SECTION 1: PARTIES ────────────────────────────────────────
  sh(1,'Parties to the Agreement');
  const hw=(CW-8)/2;
  const partyH=88;
  need(partyH);
  [[o,'LANDLORD',ML],[a,'TENANT',ML+hw+8]].forEach(([obj,lbl,px])=>{
    doc.setFillColor.apply(doc,FGRAY); doc.setDrawColor.apply(doc,BORDER);
    doc.setLineWidth(0.4); doc.rect(px,y,hw,partyH,'FD');
    doc.setFillColor.apply(doc,LTBLUE); doc.rect(px,y,hw,14,'F');
    sf('helvetica','bold',8,NAVY); doc.text(lbl,px+4,y+10);
    sf('helvetica','bold',10,BLACK); doc.text(pdfClean(obj.name||''),px+4,y+25);
    sf('helvetica','normal',8,GRAY);
    [obj.address,obj.phone,obj.email].filter(Boolean).forEach((line,i)=>{
      doc.splitTextToSize(pdfClean(line),hw-10).forEach((ln,j)=>doc.text(ln,px+4,y+37+i*13+j*10));
    });
  });
  y+=partyH+FBG;
  if(ag.coLandlord){ const _clH=fbHeight('Co-landlord / additional landlord name',ag.coLandlord,hw); need(_clH+FBG); fb('Co-landlord / additional landlord name',ag.coLandlord,ML,y,hw,_clH); }
  if(ag.additionalTenants){
    ag.additionalTenants.split('\n').filter(n=>n.trim()).forEach(n=>{
      const _atH=fbHeight('Additional tenant',n.trim(),hw); need(_atH+FBG); fb('Additional tenant',n.trim(),ML+hw+8,y,hw,_atH);
    });
  }

  // ── SECTION 2: RENTAL UNIT ────────────────────────────────────
  sh(2,'Rental Unit');
  {const _h=fbHeight('Address of rental unit (unit number, street, municipality, province, postal code)',r.property||'',CW,32); need(_h+FBG); fb('Address of rental unit (unit number, street, municipality, province, postal code)',r.property||'',ML,y,CW,_h);}
  const ps=Number(ag.parkingSpaces||0);
  fbRow([
    ['Parking spaces included',ps>0?ps+' space'+(ps>1?'s':''):'None'],
    ['Parking stall / description',ag.parkingDescription||'n/a'],
    ['Storage locker',ag.storageDescription||'None']
  ],y);
  if(ag.unitOther){ const _uoH=fbHeight('Other spaces or facilities included',ag.unitOther,CW); need(_uoH+FBG); fb('Other spaces or facilities included',ag.unitOther,ML,y,CW,_uoH); }

  // ── SECTION 3: CONTACT ────────────────────────────────────────
  sh(3,'Contact Information for Landlord');
  {const _naH=fbHeight('Address where landlord can receive notices (if different from rental unit)',ag.landlordNoticeAddress||o.address||'',CW,32); need(_naH+FBG); fb('Address where landlord can receive notices (if different from rental unit)',ag.landlordNoticeAddress||o.address||'',ML,y,CW,_naH);}
  fbRow([['Landlord phone',o.phone||''],['Landlord email',o.email||'']],y);

  // ── SECTION 4: TERM ───────────────────────────────────────────
  sh(4,'Term of Tenancy Agreement');
  {const _tsH=fbHeight('Tenancy start date',r.moveIn?fmtDate(r.moveIn):'',hw); need(_tsH+FBG); fb('Tenancy start date',r.moveIn?fmtDate(r.moveIn):'',ML,y,hw,_tsH);}
  note('After a fixed-term tenancy ends it automatically becomes month-to-month unless both parties agree to a new fixed term.');
  need(CBH*2+4);
  y+=chk(ML,y,ag.termType!=='monthly','Fixed term ending on:')+4;
  if(ag.termType!=='monthly'){
    const _endH=fbHeight('End date of fixed-term tenancy',ag.termEnd?fmtDate(ag.termEnd):'',160); need(_endH+FBG+4); y+=2;
    fb('End date of fixed-term tenancy',ag.termEnd?fmtDate(ag.termEnd):'',ML+18,y,160,_endH);
    y+=4;
  }
  need(CBH+4); y+=chk(ML,y,ag.termType==='monthly','Month-to-month — continues until notice given by either party')+6;

  // ── SECTION 5: RENT ───────────────────────────────────────────
  doc.addPage(); y=MT;
  sh(5,'Rent');
  fbRow([
    ['Base rent (per month)',money(r.rent)],
    ['Rent due on (day of month)',ag.rentDay?'Day '+ag.rentDay:'Day 1'],
    ['Payment method',ag.rentMethod||''],
    ['Rent payable to',ag.rentPayableTo||o.name||'']
  ],y);
  const frd=ag.firstRentDate||r.moveIn||''; const fra=ag.firstRentAmount||r.rent||'';
  fbRow([['Date of first rent payment',frd?fmtDate(frd):''],['Amount of first payment (if partial month differs)',money(fra)]],y);

  // ── SECTION 6: SERVICES ───────────────────────────────────────
  sh(6,'Services and Utilities');
  note('Check each item that is included in the rent. Anything not checked is the tenant\'s responsibility to arrange and pay separately.');
  need(CBH*3+12);
  [['Heat',ag.includesHeat],['Water and hot water',ag.includesWater],['Electricity',ag.includesElectricity]].forEach(([lbl,inc])=>{
    need(CBH+4); y+=chk(ML,y,inc,lbl+(inc?' — included in rent':' — not included, tenant responsible'))+2;
  });
  y+=4;
  if(ps>0&&ag.parkingCost&&Number(ag.parkingCost)>0){
    {const _pcH=fbHeight('Parking charge (separate from rent, $/month)',money(ag.parkingCost)+'/month',CW); need(_pcH+FBG); fb('Parking charge (separate from rent, $/month)',money(ag.parkingCost)+'/month',ML,y,CW,_pcH);}
  }
  if(ag.otherServices){ const _osH=fbHeight('Other services included in rent',ag.otherServices,CW); need(_osH+FBG); fb('Other services included in rent',ag.otherServices,ML,y,CW,_osH); }

  // ── SECTION 7: DISCOUNTS ──────────────────────────────────────
  sh(7,'Rent Discounts');
  note('A discount reduces what the tenant pays. Must be described here even if already reflected in the rent amount above.');
  need(CBH*2+8);
  y+=chk(ML,y,!ag.hasDiscount,'No rent discount applies')+4;
  y+=chk(ML,y,!!ag.hasDiscount,'A rent discount applies:')+4;

  }

  // ── SECTION 8: RENT DEPOSIT ───────────────────────────────────
  sh(8,'Rent Deposit');
  note('A landlord may collect a last month\'s rent deposit. It is held and applied to the last month\'s rent. Interest accrues annually at the Ontario rent increase guideline rate.');
  need(CBH*2+8);
  y+=chk(ML,y,!ag.depositHeld,'No rent deposit has been collected')+4;
  y+=chk(ML,y,!!ag.depositHeld,'A rent deposit has been collected')+4;
  if(ag.depositHeld){
    fbRow([['Deposit amount',money(ag.depositAmount||r.rent||'')],['Date deposit was paid',ag.depositDate?fmtDate(ag.depositDate):'']],y);
  }

  // ── SECTION 9: KEY DEPOSIT ────────────────────────────────────
  sh(9,'Key Deposit');
  note('A key deposit may only be charged if it does not exceed the cost of replacing the key, fob, or card. It must be returned when the tenancy ends.');
  need(CBH*2+8);
  y+=chk(ML,y,!ag.keyDeposit,'No key deposit has been collected')+4;
  y+=chk(ML,y,!!ag.keyDeposit,'A key deposit has been collected')+4;
  if(ag.keyDeposit){
    fbRow([['Key deposit amount',money(ag.keyDepositAmount||'')],['Replacement cost of key/fob',money(ag.keyReplacementCost||'')]],y);
  }

  // ── SECTION 10: SMOKING ───────────────────────────────────────
  sh(10,'Smoking');
  need(CBH*2+10);

  y+=chk(ML,y,!!ag.smokingAllowed,'Smoking or vaping is permitted in the following areas:')+4;
  if(ag.smokingAllowed){ const _smH=fbHeight('Areas where smoking/vaping is permitted',ag.smokingDetails||'',CW-18); need(_smH+FBG); fb('Areas where smoking/vaping is permitted',ag.smokingDetails||'',ML+18,y,CW-18,_smH); }
  else { y+=4; }

  // ── SECTION 11: INSURANCE ─────────────────────────────────────
  sh(11,"Tenant's Insurance");
  need(CBH*2+10);
  y+=chk(ML,y,!!ag.insuranceRequired,'The tenant is required to obtain and maintain tenant liability insurance for the duration of the tenancy')+4;

  note('Even when not required, tenants are strongly encouraged to purchase content and liability insurance. The landlord\'s insurance does not cover the tenant\'s possessions or personal liability.');

  // ── SECTION 12: CHANGES TO UNIT ──────────────────────────────
  doc.addPage(); y=MT;
  sh(12,'Changes to the Rental Unit');
  note('The tenant agrees not to alter, add to, or renovate the rental unit (including changing the locks) without the written consent of the landlord. If changes are made without consent, the landlord may require the tenant to restore the unit to its original condition. On vacating, the tenant must leave the unit as received at the start of the tenancy, except for reasonable wear and tear.');
  if(ag.changesNotes){ const _cnH=fbHeight('Additional agreed terms regarding changes to the unit',ag.changesNotes,CW); need(_cnH+FBG); fb('Additional agreed terms regarding changes to the unit',ag.changesNotes,ML,y,CW,_cnH); }

  sh(13,'Maintenance and Repairs');
  note('The landlord is responsible for maintaining the rental property in a good state of repair and fit for habitation, and for complying with health, safety, housing, and maintenance standards, even if the tenant was aware of a problem before entering the tenancy. The tenant is responsible for ordinary cleanliness and for repairing any damage caused by the wilful or negligent conduct of the tenant or their guests.');

  // ── SECTION 14: ASSIGNMENT AND SUBLETTING ────────────────────
  sh(14,'Assignment and Subletting');

  // ── SECTION 16: CHANGES TO AGREEMENT ─────────────────────────
  sh(16,'Changes to this Agreement');
  note('Changes to this agreement can only be made if both parties agree. Any changes must be made in writing and signed by both the landlord and tenant. Any change that takes away a right or responsibility under the Residential Tenancies Act, 2006 is void.');

  // ── SECTION 17: SIGNATURES ────────────────────────────────────
  sh(17,'Signatures');
  note('The landlord must give the tenant a copy of the signed lease within 21 days of signing. Each party must keep a copy of this agreement.');
  y+=4;

  if(ag.additionalTenants) ag.additionalTenants.split('\n').filter(n=>n.trim()).forEach(n=>sigParties.push([n.trim(),'Additional Tenant']));

  // sigH=96: role header 0-14, name 23-43, sig line at 54, date line at 76 (always inside box)
  const sigH=96;
  for(let i=0;i<sigParties.length;i+=2){

      sf('helvetica','normal',7,GRAY); doc.text('Print name:',sx+5,y+23);
      sf('helvetica','normal',9.5,BLACK);

      doc.setDrawColor(90,90,90); doc.setLineWidth(0.5);
      doc.line(sx+5,y+54,sx+sw-5,y+54);
      sf('helvetica','normal',6.5,GRAY); doc.text('Signature',sx+5,y+62);
      doc.setDrawColor(90,90,90); doc.setLineWidth(0.5);
      doc.line(sx+5,y+76,sx+sw-5,y+76);
      sf('helvetica','normal',6.5,GRAY); doc.text('Date signed (YYYY-MM-DD)',sx+5,y+84);
    });
    y+=sigH+10;

  // ── FOOTER NOTE ───────────────────────────────────────────────
  need(28); y+=6;

function downloadLeasePdf(){

function resolveNoticeForm(q1,q2){
  if(q1==='nonpayment') return 'n4';
  if(q1==='damage'){ if(q2==='safety') return 'n7'; if(q2==='other') return 'n5'; }
  if(q1==='need-back'){ if(q2==='family') return 'n12'; if(q2==='work') return 'n13'; }
  if(q1==='patterns'){ if(q2==='late') return 'n8-late'; if(q2==='crowd') return 'n8-crowd'; }
  return null;
}

function buildNoticePdf(formKey){
  const jspdfLib=window.jspdf; if(!jspdfLib||!jspdfLib.jsPDF) return null;
  const { jsPDF }=jspdfLib; const doc=new jsPDF({unit:'pt',format:'letter'});
  initNoticeData(); const nd=ui.noticeData; const m=NOTICE_META[formKey];
  const W=612,H=792,M=40;
  const INK=[28,43,57],MUT=[107,102,89],RED=[154,51,36],LINE=[201,194,179],AMB=[184,134,63];
  let y=M;

  const txt=(s,opts={})=>{ doc.setFont('helvetica',opts.bold?'bold':'normal'); doc.setFontSize(opts.size||10); doc.setTextColor(...(opts.color||INK));
    const lines=doc.splitTextToSize(s,opts.w||(W-M*2)); doc.text(lines,M,y); y+=lines.length*(opts.size||10)*1.3+(opts.gap!=null?opts.gap:4); };
  const section=(title)=>{ y+=6; doc.setDrawColor(...LINE); doc.setLineWidth(0.5); doc.line(M,y,W-M,y); y+=10;
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...MUT); doc.text(title.toUpperCase(),M,y); y+=12; };
  const twoCol=(l1,v1,l2,v2)=>{ const hw=(W-M*2-12)/2;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT); doc.text(l1.toUpperCase(),M,y); doc.text(l2.toUpperCase(),M+hw+12,y); y+=10;
    doc.setFontSize(10); doc.setTextColor(...INK);
    const a=doc.splitTextToSize(v1||'—',hw), b=doc.splitTextToSize(v2||'—',hw);
    doc.text(a,M,y); doc.text(b,M+hw+12,y); y+=Math.max(a.length,b.length)*13+6; };

  // Header
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...RED);
  doc.text('DRAFT — FOR REFERENCE ONLY — FILE THE OFFICIAL TRIBUNALS ONTARIO FORM',M,y); y+=14;
  doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text(m.short,M,y); y+=4;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const titleLines=doc.splitTextToSize(m.title,W-M*2); doc.text(titleLines,M,y); y+=titleLines.length*13+8;

  // Draft watermark
  doc.saveGraphicsState();
  doc.setFont('helvetica','bold'); doc.setFontSize(80); doc.setTextColor(220,60,40);
  doc.setGState(new doc.GState({opacity:0.08}));
  doc.text('DRAFT',W/2,H/2,{align:'center',angle:35});
  doc.restoreGraphicsState();

  section('Parties');
  twoCol('Landlord Name',nd.landlordName,'Landlord Address',nd.landlordAddress);
  twoCol('Tenant Name',nd.tenantName,'Rental Unit Address',nd.rentalUnit);

  section('Notice Details');
  if(formKey==='n4'){
    const termDate=nd.noticeDate?addDays(nd.noticeDate,14):'';
    twoCol('Date of Notice',nd.noticeDate?fmtDate(nd.noticeDate):''  ,'Monthly Rent',nd.rentAmount?money(nd.rentAmount):'');
    twoCol('Rent Period From',nd.periodFrom?fmtDate(nd.periodFrom):'','Rent Period To',nd.periodTo?fmtDate(nd.periodTo):'');
    twoCol('Total Amount Owed',nd.amountOwed?money(nd.amountOwed):'' ,'Termination Date',termDate?fmtDate(termDate):'');
    y+=4; txt('The tenant must pay the full amount owed or vacate by the termination date. If they pay in full, this notice is void.',{size:9,color:MUT});
    txt('If the tenant does not pay and does not vacate, you may file an L1 Application at tribunalsontario.ca/ltb/e-file/',{size:9,color:MUT});
  } else if(formKey==='n5'){
    const termDate=nd.noticeDate?addDays(nd.noticeDate,20):'';
    twoCol('Date of Notice',nd.noticeDate?fmtDate(nd.noticeDate):'','Date(s) of Incident',nd.incidentDate?fmtDate(nd.incidentDate):'');
    twoCol('Earliest Termination Date',termDate?fmtDate(termDate):'','Notice Type','First notice (7-day remedy period)');
    y+=4; txt('Description of problem:',{bold:true,size:9});
    txt(nd.incidentDescription||'(not entered)',{size:9,color:MUT});
    txt('The tenant has 7 days to remedy the problem. If remedied, this notice is void. If not, file an L2 Application.',{size:9,color:MUT});
  } else if(formKey==='n7'){
    const termDate=nd.noticeDate?addDays(nd.noticeDate,10):'';
    twoCol('Date of Notice',nd.noticeDate?fmtDate(nd.noticeDate):'','Termination Date (10 days)',termDate?fmtDate(termDate):'');
    twoCol('Date(s) of Incident',nd.incidentDate?fmtDate(nd.incidentDate):'','','');
    y+=4; txt('Description of serious safety issue:',{bold:true,size:9});
    txt(nd.incidentDescription||'(not entered)',{size:9,color:MUT});
    txt('N7 is for serious safety issues only. No remedy period. You may file an L2 Application immediately.',{size:9,color:MUT});
  } else if(formKey==='n8-late'||formKey==='n8-crowd'){
    const termDate=nd.noticeDate?addDays(nd.noticeDate,60):'';
    twoCol('Date of Notice',nd.noticeDate?fmtDate(nd.noticeDate):'','Minimum Termination Date (60 days)',termDate?fmtDate(termDate):'');
    y+=4; txt(formKey==='n8-late'?'Late payment history:':'Overcrowding details:',{bold:true,size:9});
    txt(nd.latePaymentHistory||'(not entered)',{size:9,color:MUT});
    txt('The termination date must be the last day of a rental period at least 60 days after this notice.',{size:9,color:MUT});
  } else if(formKey==='n12'){
    const termDate=nd.noticeDate?addDays(nd.noticeDate,60):'';
    const whoMap={landlord:'The landlord',purchaser:'A purchaser of the property',family:'A family member of the landlord'};
    twoCol('Date of Notice',nd.noticeDate?fmtDate(nd.noticeDate):'','Minimum Termination Date (60 days)',termDate?fmtDate(termDate):'');
    twoCol('Who Requires the Unit',whoMap[nd.whoMovesIn]||nd.whoMovesIn,'Relationship',nd.whoMovesIn==='family'?(nd.moveInRelationship||''):'n/a');
    const comp=nd.rentAmount?money(nd.rentAmount):"1 month's rent";
    y+=4; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...RED);
    doc.text('Compensation required: '+comp+' must be paid to the tenant by the termination date.',M,y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...MUT);
    doc.text('The person moving in must actually reside in the unit for at least 12 months. Bad-faith evictions carry heavy penalties.',M,y,{maxWidth:W-M*2}); y+=20;
  } else if(formKey==='n13'){
    const termDate=nd.noticeDate?addDays(nd.noticeDate,120):'';
    const reasonMap={demolition:'Demolition',repair:'Extensive repairs requiring vacant unit',conversion:'Conversion to non-residential use'};
    const comp3=nd.rentAmount?money(Number(nd.rentAmount)*3):"3 months' rent";
    twoCol('Date of Notice',nd.noticeDate?fmtDate(nd.noticeDate):'','Minimum Termination Date (120 days)',termDate?fmtDate(termDate):'');
    twoCol('Reason',reasonMap[nd.workReason]||nd.workReason,'','');
    y+=4; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...RED);
    doc.text('Compensation required: '+comp3+' must be paid to the tenant.',M,y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...MUT);
    doc.text('The termination date must be last day of a rental period at least 120 days from this notice.',M,y,{maxWidth:W-M*2}); y+=16;
  }

  section('Next Steps');
  txt('1. Download the official '+m.short+' form: tribunalsontario.ca/ltb/forms/',{size:9});
  txt('2. Complete and serve the official form on the tenant by an acceptable method.',{size:9});
  txt('3. After the termination date (if unresolved), file your application: tribunalsontario.ca/ltb/e-file/',{size:9});
  txt('4. Search for past LTB orders against this tenant (free): openroom.ca/tenant-screening/',{size:9});

  // Footer disclaimer
  const discY=H-M-20;
  doc.setDrawColor(...LINE); doc.setLineWidth(0.5); doc.line(M,discY-10,W-M,discY-10);
  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(...MUT);
  doc.text('DRAFT — This document was generated for reference only. It is not the official LTB notice. File the official Tribunals Ontario form. Contains personal information — store and dispose of securely.',M,discY,{maxWidth:W-M*2});

  return doc;
}
function downloadNoticePdf(formKey){
  const m=NOTICE_META[formKey];
  const doc=buildNoticePdf(formKey); if(!doc){ toast('PDF library not loaded'); return; }
  const nm=(ui.noticeData&&ui.noticeData.tenantName?ui.noticeData.tenantName.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''):'tenant');
  doc.save(m.short.toLowerCase()+'-draft-'+nm+'-'+todayISO()+'.pdf');
  toast('Draft PDF downloaded — remember to file the official '+m.short+' form from Tribunals Ontario');
}

/* ======================= ROOT ======================= */
function render(){ renderList(); renderMain(); }
if(!window.__TEST__){ load(); handleRentRollRequest(); render(); initLtbMeta(); }
</script>
