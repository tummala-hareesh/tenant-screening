<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEASE — Landlord Essentials: Applicants, Screening &amp; Evictions</title>
<meta name="description" content="Screen. Sign. Serve. Built by an Ontario small landlord, for Ontario small landlords — completely free, always.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--ink:#1C2B39;--paper:#EFEBE3;--raised:#F8F5EF;--red:#9A3324;--green:#3F6B54;--amber:#B8863F;--line:#C9C2B3;--muted:#6b6659;--gold:#D9B77A;--gold-dark:#B8953A;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,h4,.brand{font-family:'Source Serif 4',Georgia,serif;margin:0}
.top{background:var(--ink);color:#F8F5EF;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--gold)}
.brand{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1}.brand em{font-style:normal;color:var(--gold)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:20px 16px}
.layout>*{min-width:0}
@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{padding:12px}h2{word-break:break-word}}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:16px}
.panel h3{font-size:18px;margin-bottom:4px}
.sec-no{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}
.field{margin-bottom:10px;flex:1;min-width:140px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);transition:border-color 150ms ease-out,box-shadow 150ms ease-out}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,183,122,.2)}
input:disabled,select:disabled,textarea:disabled{background:#ece8de;color:#8a8576}
.row{display:flex;gap:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:3px;padding:8px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background 150ms ease-out,color 150ms ease-out,border-color 150ms ease-out}
button:hover:not(:disabled){background:var(--gold);color:var(--ink);border-color:var(--gold)}
.primary{background:var(--ink);color:#F8F5EF}
.primary:hover:not(:disabled){background:var(--gold);color:var(--ink);border-color:var(--gold)}
.top a{text-decoration:underline;text-underline-offset:2px}
.top .primary{background:#D9B77A;color:var(--ink);border-color:#D9B77A;font-weight:600}
.danger{border-color:var(--red);color:var(--red)}
.small{padding:4px 9px;font-size:13px}
.item{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--line);background:var(--raised);border-radius:3px;margin-bottom:8px;cursor:pointer}
.item.active{border-color:var(--ink);border-left-color:var(--ink)}
.item .t{font-weight:600}.item .m{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;color:#fff;white-space:nowrap}
.c-clear,.c-met{background:var(--green)}.c-concern,.c-not_met{background:var(--red)}
.c-unchecked,.c-incomplete{background:#8a8576}.c-na{background:#9a8a66}.c-review{background:var(--amber)}
.dim{border:1px solid var(--line);border-radius:4px;background:#fff;padding:12px;margin-bottom:10px}
.dim-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.dim-h b{font-family:'Source Serif 4',serif;font-size:16px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-left:6px}
.consent{background:#F4EEDD;border-radius:3px;padding:6px 10px;margin:8px 0;font-size:13px;display:flex;gap:8px;align-items:center}
.consent input{width:auto}
fieldset{border:0;margin:0;padding:0;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin:10px 0}
.tile{border-radius:3px;color:#fff;padding:8px 6px;font-size:12px;text-align:center;font-weight:600}
.tile small{display:block;font-weight:400;opacity:.9;font-size:11px}
.outcome{border-left:6px solid var(--ink);padding:12px 14px;border-radius:3px;background:#fff}
.o-met{border-color:var(--green)}.o-not_met{border-color:var(--red)}.o-review{border-color:var(--amber)}.o-incomplete{border-color:#8a8576}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:3px 8px;transform:rotate(-2deg);letter-spacing:.06em}
.note{background:#F1E3C4;color:#5c4416;border-radius:3px;padding:8px 10px;font-size:13px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid var(--ink);padding:6px}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.doccheck{border:1px dashed var(--ink);border-radius:4px;padding:10px 12px;margin:10px 0;background:#FBF9F4}
.finding{font-size:13px;margin:5px 0;padding-left:8px;border-left:3px solid var(--line)}
.f-high{border-left-color:var(--red)}.f-warn{border-left-color:var(--amber)}
.finding b{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-right:6px;text-transform:uppercase}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
a{color:var(--ink)}

.stepper{position:sticky;top:0;z-index:6;background:var(--paper);padding:8px 0 10px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding:0;list-style:none}
.stbtn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:3px;background:var(--raised);display:block;line-height:1.2;min-height:48px}
.stbtn .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.stbtn .l{display:block;font-weight:600;font-size:14px}
.stbtn .s{display:block;font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbtn.on{border-color:var(--ink);border-bottom-color:var(--gold);background:#fff}
.stbtn.done{border-bottom-color:var(--green)}.stbtn.done .n{color:var(--green)}
.stbtn.warn{border-bottom-color:var(--red)}.stbtn.warn .n{color:var(--red)}
.stbtn.part{border-bottom-color:var(--amber)}
.stp{display:none}.stp.on{display:block}
.stfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 24px}
.dimnav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.dimgrp{margin:10px 0 12px}
.dimnav button{padding:5px 10px;font-size:13px;border-radius:14px;background:var(--raised);border-color:var(--line);display:inline-flex;align-items:center;gap:6px}
.dimnav button.on{background:var(--ink);color:#F8F5EF;border-color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8a8576;border:1px solid rgba(255,255,255,.6)}
.dot.c-clear{background:var(--green)}.dot.c-concern{background:var(--red)}.dot.c-review{background:var(--amber)}.dot.c-na{background:#9a8a66}
.dimnext{display:flex;justify-content:flex-end;margin:-2px 0 12px}
@media(max-width:820px){
  .steps{grid-template-columns:repeat(4,minmax(104px,1fr));overflow-x:auto;padding-bottom:4px}
  #list{display:flex;gap:8px;overflow-x:auto;align-items:stretch}#list .sec-no{display:none}#list .item{min-width:190px;margin:0}
}
@media print{
  .stp{display:block!important}.stepper,.stfoot,.dimnav,.dimnext{display:none!important}
  .top,#list,.actions,.noprint,.toast{display:none!important}
  .layout{display:block;padding:0}body{background:#fff}.panel{border:0;padding:0}
}
</style>
</head>
<body>
<div class="top"><div class="brand" style="display:flex;align-items:center;gap:16px"><span style="color:var(--gold);font-size:32px;font-weight:700;letter-spacing:.02em;font-family:'Source Serif 4',Georgia,serif;line-height:1;cursor:pointer" onclick="ui.view='home';render();window.scrollTo(0,0)">LEASE</span><div style="border-left:1px solid #2E4358;padding-left:16px;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:600;color:#F8F5EF;letter-spacing:-.01em;font-family:'Instrument Sans',sans-serif;line-height:1.2">Landlord Essentials: Applicants, Screening &amp; Evictions</span><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;line-height:1">Screen · Sign · Serve</span></div></div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="primary" onclick="newScreening()">+ New screening</button><button onclick="ui.view='notices';ui.noticeForm=null;ui.noticeQ1='';ui.noticeQ2='';render()" style="background:transparent;border-color:var(--gold);color:var(--gold)">LTB Notices</button><a href="https://www.buymeacoffee.com" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;background:#FFDD00;color:#000;font-weight:700;font-size:13px;padding:7px 14px;border-radius:3px;text-decoration:none;border:1px solid #e6c800;white-space:nowrap">☕ Support</a></div></div>
<div class="layout"><aside id="list"></aside><main id="main"></main></div>
<div class="toast" id="toast"></div>
<footer class="noprint" style="background:var(--ink);color:#6B8599;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
  <span>LEASE — Landlord Essentials: Applicants, Screening &amp; Evictions</span>
  <span style="color:#4A6A7A">Your data never leaves your browser &nbsp;·&nbsp; No account &nbsp;·&nbsp; No server &nbsp;·&nbsp; PIPEDA-compliant by design &nbsp;·&nbsp; Completely free, always</span>
</footer>

<script>
/* ======================= CONFIG ======================= */
const STORE_KEY = 'tenantScreening:v1';
const REASONS = {
  credit_below_threshold:'Credit score below the minimum set in the locked criteria',
  income_insufficient:'Owner assessed that income does not cover the rent',
  reference_failed:'Reference / rental history check did not pass',
  reference_missing:'Reference check required by the criteria but not provided',
  identity_not_verified:'Identity could not be verified',
  other_documented:'Other (owner-documented justification)'
};
const CONSENTS = {
  credit:'Credit report',
  reference:'Contacting previous landlords / references',
  employment:'Contacting employer',
  public:'Public-records searches (LTB, courts, bankruptcy)',
  police:'Police record check (obtained by the applicant)'
};
const STATUS_LABEL = {unchecked:'Not checked', clear:'Clear', concern:'Concern', na:'Not provided'};
const OUTCOME_LABEL = {met:'Meets criteria', not_met:'Does not meet criteria', review:'Flagged for owner review', incomplete:'Incomplete'};
const DIMS = [
  {key:'identity', short:'ID', name:'Identity verification', req:true, desc:'Sight a government photo ID and confirm the name matches the application.',
   sources:['Government photo ID sighted in person','ID copy supplied by applicant'], choose:true},
  {key:'credit', short:'Credit', name:'Credit report', req:true, consent:'credit', desc:'Enter the score from a licensed bureau report. Status is worked out from the minimum you locked.',
   sources:['Equifax Canada (applicant-supplied)','TransUnion Canada (applicant-supplied)','Equifax / TransUnion direct','FrontLobby','Certn','Other licensed provider'], link:['Equifax Canada','https://www.equifax.ca']},
  {key:'income', short:'Income', name:'Income and affordability', req:true, desc:'Collected only alongside the credit check (O. Reg. 290/98). Answer yes/no: does income cover the rent? The rent-to-income number is information only and never decides the outcome.',
   sources:['Recent paystubs','Employment letter','CRA Notice of Assessment','Bank statements']},
  {key:'employment', short:'Employer', name:'Employment verification', consent:'employment', desc:'Optional. Confirms the employer and role the applicant stated.', sources:['Employer contacted by phone/email','Employment letter','Preliminary: payslip analysis and public web search']},
  {key:'references', short:'Refs', name:'Rental history and landlord references', consent:'reference', refDim:true, desc:'Contact current and previous landlords with the same questions for every applicant.',
   sources:['Current landlord','Previous landlord','Landlord letter']},
  {key:'ltb', short:'LTB', name:'LTB decisions (public record)', consent:'public', desc:'Look for Landlord and Tenant Board orders against the applicant. A confirmed arrears order is flagged for your review, not an automatic fail, and the applicant should get a chance to respond.',
   sources:['LTB Open Data Catalogue','CanLII','Tribunals Ontario decisions search'], link:['CanLII','https://www.canlii.org']},
  {key:'court', short:'Courts', name:'Court records (civil / small claims)', consent:'public', desc:'Search for civil judgments relating to rent or property.',
   sources:['Ontario Courts Public Portal (Toronto region)','Justice Services Online (elsewhere in Ontario)','CanLII'], link:['Ontario Courts Public Portal','https://courts.ontario.ca/portal/home']},
  {key:'bankruptcy', short:'Bankr.', name:'Bankruptcy and insolvency', consent:'public', desc:'Check the federal insolvency record. A small fee applies on the government search.',
   sources:['OSB Bankruptcy and Insolvency search','Credit report public-records section'], link:['OSB records search (min. $8)','https://ised-isde.canada.ca/site/office-superintendent-bankruptcy/en/bankruptcy-and-insolvency-records-search/bankruptcy-and-insolvency-records-search']},
  {key:'police', short:'Police', name:'Police record check (applicant-supplied)', consent:'police', desc:'Optional. Only a check the applicant obtains and shares themselves, with written consent. Apply the same rule to every applicant.',
   sources:['Applicant-obtained police record check']}
];

/* ======================= STATE ======================= */
let data = { screenings:[], owner:{name:'',address:'',phone:'',email:''}, ownerProfiles:[] };
let ui = { view:'home', id:null, confirmDelete:null, ownerOpen:false, ownerTab:'edit', editingProfileId:null, noticeForm:null, noticeData:null, noticeQ1:'', noticeQ2:'' };
const STEPS=[{n:1,l:'Setup'},{n:2,l:'Documents'},{n:3,l:'Checks'},{n:4,l:'Result'}];
function stepInfo(s){
  const e=evaluate(s); const done=DIMS.filter(d=>dimStatus(s,d.key)!=='unchecked').length; const anyConcern=DIMS.some(d=>dimStatus(s,d.key)==='concern');
  const a=!!(s.applicant.name&&s.rental.property&&s.rental.rent);
  const docs=(s.docs||[]).length;
  return {
    1:{c:(a&&s.criteria.lockedAt)?'done':(a?'part':''),t:s.criteria.lockedAt?'Criteria locked':(a?'Lock criteria':'Applicant needed')},
    2:{c:docs?'done':'',t:docs?docs+' read':'Optional'},
    3:{c:DIMS.filter(d=>isMust(s,d)).every(d=>dimStatus(s,d.key)!=='unchecked')?(anyConcern?'warn':'done'):(done?'part':''),t:(()=>{ const mu=DIMS.filter(d=>isMust(s,d)); const md=mu.filter(d=>dimStatus(s,d.key)!=='unchecked').length; return 'Must haves '+md+'/'+mu.length+(anyConcern?' · concern':''); })()},
    4:{c:e.final==='incomplete'?'':(e.final==='met'?'done':(e.final==='not_met'?'warn':'part')),t:OUTCOME_LABEL[e.final]||''}
  };
}
function smartStep(s){ const i=stepInfo(s); if(!s.applicant.name||!s.rental.property||!s.criteria.lockedAt) return 1; if(i[3].c===''||i[3].c==='part') return (s.docs||[]).length?3:2; return 4; }
function stepperHtml(s){
  const i=stepInfo(s);
  return `<ol class="steps" role="list">${STEPS.map(st=>`<li><button class="stbtn ${i[st.n].c} ${ui.step===st.n?'on':''}" aria-current="${ui.step===st.n?'step':'false'}" onclick="goStep(${st.n})"><span class="n">${i[st.n].c==='done'?'✓':st.n}</span> <span class="l">${st.l}</span><span class="s">${esc(i[st.n].t)}</span></button></li>`).join('')}</ol>`;
}
function goStep(n){ ui.step=Math.max(1,Math.min(4,n)); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goDim(k){ ui.dim=k; render(); }
function stp(n){ return ui.step===n?'on':''; }
function stepWrap(n,html){ return `<div class="stp ${stp(n)}" data-step="${n}">${html}</div>`; }
function isMust(s,d){ return !!d.req || (d.refDim && !!(s.criteria&&s.criteria.refRequired)); }
function dimOrder(s){ return DIMS.filter(d=>isMust(s,d)).concat(DIMS.filter(d=>!isMust(s,d))); }
function dimNavHtml(s){
  const cur=ui.dim||'identity'; const btn=d=>`<button role="tab" class="${cur===d.key?'on':''}" onclick="goDim('${d.key}')"><span class="dot c-${dimStatus(s,d.key)}" data-dimdot="${d.key}"></span>${d.short}</button>`;
  const must=DIMS.filter(d=>isMust(s,d)), nice=DIMS.filter(d=>!isMust(s,d));
  const mDone=must.filter(d=>dimStatus(s,d.key)!=='unchecked').length;
  return `<div class="dimgrp"><div class="sec-no">Must haves <span class="badge" style="margin-left:4px">${mDone} of ${must.length} recorded</span></div><div class="dimnav" role="tablist">${must.map(btn).join('')}</div>
    <div class="sec-no" style="margin-top:6px">Nice to haves <span class="badge" style="margin-left:4px">optional</span></div><div class="dimnav" role="tablist">${nice.map(btn).join('')}<button class="${cur==='all'?'on':''}" onclick="goDim('all')">Show all</button></div></div>`;
}
function dimCardsHtml(s){
  if(ui.dim!=='all') return DIMS.filter(d=>d.key===ui.dim).map(d=>dimCard(s,d)).join('');
  const must=DIMS.filter(d=>isMust(s,d)), nice=DIMS.filter(d=>!isMust(s,d));
  return `<h4 style="margin:6px 0 8px;font-family:'Source Serif 4',serif">Must haves</h4>${must.map(d=>dimCard(s,d)).join('')}<h4 style="margin:14px 0 8px;font-family:'Source Serif 4',serif">Nice to haves</h4>${nice.map(d=>dimCard(s,d)).join('')}`;
}
function dimNextHtml(s){
  const cur=ui.dim||'identity'; if(cur==='all') return ''; const O=dimOrder(s); const i=O.findIndex(d=>d.key===cur);
  return i<O.length-1?`<div class="dimnext"><button class="small" onclick="goDim('${O[i+1].key}')">Next check: ${O[i+1].short} →</button></div>`:`<div class="dimnext"><button class="small primary" onclick="goStep(4)">All checks reviewed: see the result →</button></div>`;
}
function stepFootHtml(){
  const n=ui.step; const prev=STEPS[n-2], next=STEPS[n];
  return `<div class="stfoot noprint"><div>${prev?`<button onclick="goStep(${n-1})">← ${prev.l}</button>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${n===4?`<button class="primary" onclick="ui.view='report';render();window.scrollTo(0,0)">View report and download PDF</button>`:''}${next?`<button class="primary" onclick="goStep(${n+1})">Next: ${next.l} →</button>`:''}</div></div>`;
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function nowISO(){ return new Date().toISOString(); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso.length===10?iso+'T12:00:00':iso); return d.toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDT(iso){ if(!iso) return '-'; const d=new Date(iso); return fmtDate(iso)+' '+d.toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit'}); }
function money(n){ return '$'+Number(n||0).toLocaleString('en-CA',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function load(){ try{ const v=localStorage.getItem(STORE_KEY); if(v) data=JSON.parse(v); }catch(e){} if(!data.owner) data.owner={name:'',address:'',phone:'',email:''}; if(!data.ownerProfiles) data.ownerProfiles=[]; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){ toast('Could not save in this browser'); } }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2200); }
function cur(){ return data.screenings.find(s=>s.id===ui.id); }

function blankScreening(){
  return { id:uid(), createdAt:nowISO(), updatedAt:nowISO(),
    applicant:{name:'',email:'',phone:'',address:''},
    rental:{property:'',rent:'',moveIn:''},
    criteria:{minCredit:'',refRequired:true,lockedAt:null},
    consents:{}, checks:{}, credit:{score:''}, income:{monthly:'',sufficient:''},
    override:{outcome:'',justification:''}, applicantResponse:'', docCheck:null, sourceVerified:{method:'',date:'',steps:[]}, attestation:{given:false,at:null}, docs:[], docConfirm:{idPhoto:false,employer:false}, manual:{}, prelim:null, prelimIn:{}, source:null, sentAt:null, ackAt:null, downloadedAt:null,
    agreement:{termType:'fixed',termEnd:'',rentDay:'1',rentMethod:'',includesHeat:false,includesWater:false,includesElectricity:false,parkingSpaces:'0',parkingCost:'',smokingAllowed:false,insuranceRequired:true,additionalTerms:'',generatedAt:null} };
}
function newScreening(){ const s=blankScreening(); data.screenings.unshift(s); save(); ui={view:'edit',id:s.id,confirmDelete:null}; render(); }
function sampleScreening(){
  const s=blankScreening();
  s.applicant={name:'Sample Applicant',email:'sample@example.com',phone:'416-555-0100',address:'12 Example St, Mississauga ON'};
  s.rental={property:'45 Demo Ave, Unit 2, Toronto ON',rent:'2100',moveIn:''};
  s.criteria={minCredit:650,refRequired:true,lockedAt:nowISO()};

/* ======================= EVALUATION ======================= */
function dimStatus(s,key){
  if(key==='credit'){ if(s.credit.score===''||s.credit.score==null||!s.criteria.lockedAt) return 'unchecked'; return Number(s.credit.score)>=Number(s.criteria.minCredit)?'clear':'concern'; }
  if(key==='income'){ return s.income.sufficient==='yes'?'clear':s.income.sufficient==='no'?'concern':'unchecked'; }
  return (s.checks[key]&&s.checks[key].status)||'unchecked';
}
function consentOK(s,d){ return !d.consent || (s.consents[d.consent]&&s.consents[d.consent].given); }
function r2i(s){ const r=Number(s.rental.rent), i=Number(s.income.monthly); return (r>0&&i>0)?Math.round(r/i*100):null; }
function evaluate(s){
  const reasons=[], flags=[], missing=[];
  const st=k=>dimStatus(s,k);
  if(!s.criteria.lockedAt) missing.push('Criteria not locked yet');
  if(st('identity')==='unchecked') missing.push('Identity verification'); else if(st('identity')!=='clear') reasons.push('identity_not_verified');
  if(st('credit')==='unchecked') missing.push('Credit report'); else if(st('credit')==='concern') reasons.push('credit_below_threshold');
  if(st('income')==='unchecked') missing.push('Income and affordability'); else if(st('income')==='concern') reasons.push('income_insufficient');
  const rs=st('references');
  if(s.criteria.refRequired){
    if(rs==='unchecked') missing.push('Rental history and landlord references');
    else if(rs==='na') reasons.push('reference_missing');
    else if(rs==='concern') reasons.push('reference_failed');
  } else if(rs==='concern') flags.push('Rental history and landlord references');
  DIMS.forEach(d=>{ if(['employment','ltb','court','bankruptcy','police'].includes(d.key) && st(d.key)==='concern') flags.push(d.name); });
  if(s.docCheck && ['warn','high','unassessable'].includes(s.docCheck.tier) && !isSourceVerified(s)) flags.push('Credit report authenticity not confirmed');
  if(s.docCheck && !(s.attestation&&s.attestation.given)) flags.push('Applicant attestation for the credit report not recorded');
  let computed = missing.length?'incomplete':(reasons.length?'not_met':(flags.length?'review':'met'));
  const ov=s.override||{};
  const overridden = !!(ov.outcome && (ov.justification||'').trim().length>=10 && computed!=='incomplete');
  const final = overridden ? ov.outcome : computed;
  return {computed, final, overridden, reasons, flags, missing};
}

  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));
  a.download='tenant-screening-backup-'+ts+'.json'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Backup exported');

function importBackup(file){
  if(!file) return;
  const reader=new FileReader(); reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      const imported=parsed.data||parsed;
      if(!imported.screenings||!Array.isArray(imported.screenings)) throw new Error('Unrecognised format');
      if(!confirm('This will replace all current data (screenings and owner profiles) with the backup. Continue?')) return;
      data=imported; if(!data.owner) data.owner={name:'',address:'',phone:'',email:''}; if(!data.ownerProfiles) data.ownerProfiles=[];
      save(); ui={view:'home',id:null,confirmDelete:null,ownerOpen:false,ownerTab:'edit'}; render(); toast('Backup imported — '+(data.screenings.length)+' screening'+(data.screenings.length!==1?'s':'')+' loaded');
    }catch(err){ toast('Could not read backup: '+err.message); }
  }; reader.readAsText(file);
}

/* Heuristics only. They look for common signs of editing. They can never prove a report is genuine. */
const TIER_LABEL = {clean:'No tampering signs found', warn:'Needs verification', high:'Signs of editing', unassessable:'Cannot assess'};
const TIER_CLASS = {clean:'c-clear', warn:'c-review', high:'c-concern', unassessable:'c-unchecked'};
const LEVEL_LABEL = {high:'High', warn:'Check', info:'Note'};
const EDIT_TOOLS = /photoshop|illustrator|acrobat pro|acrobat\s*(?:\d|dc|x)|canva|sejda|ilovepdf|smallpdf|pdfescape|pdf-?xchange|foxit|nitro|pdffiller|pdfelement|wondershare|master ?pdf|soda ?pdf|gimp|inkscape|affinity|pdf24|pdfcandy|docfly|lightpdf/i;

function parsePdfDate(v){ const m=/^D:(\d{4})(\d\d)?(\d\d)?(\d\d)?(\d\d)?(\d\d)?/.exec(String(v||'')); if(!m) return null; return new Date(Date.UTC(+m[1],(+m[2]||1)-1,+m[3]||1,+m[4]||0,+m[5]||0,+m[6]||0)); }
function extractDates(text){
  const out=[]; let m;
  const r1=/\b(20\d\d)[-\/](0?[1-9]|1[0-2])[-\/](0?[1-9]|[12]\d|3[01])\b/g;
  while((m=r1.exec(text))) out.push(new Date(Date.UTC(+m[1],+m[2]-1,+m[3])));
  const r2=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(20\d\d)\b/gi;
  while((m=r2.exec(text))) out.push(new Date(Date.UTC(+m[3],MONTHS[m[1].toLowerCase()],+m[2])));
  const r3=/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(20\d\d)\b/gi;
  while((m=r3.exec(text))) out.push(new Date(Date.UTC(+m[3],MONTHS[m[2].toLowerCase()],+m[1])));

function analyzePdf(inp){

  if(!inp.isPdf){

    return {tier:'unassessable', findings:f, producer:'', creator:'', updates:0};
  }
  const str = new TextDecoder('latin1').decode(inp.bytes);
  const eof=(str.match(/%%EOF/g)||[]).length; const lin=/\/Linearized/.test(str);
  const updates=Math.max(0,eof-1-(lin?1:0));

  const producer=String(info.Producer||xmp['pdf:producer']||''); const creator=String(info.Creator||xmp['xmp:creatortool']||'');

    add('info','metadata','File details', 'Producer: '+(producer||'none')+'. Creator: '+(creator||'none')+'. Created: '+(cd?cd.toISOString().slice(0,16).replace('T',' ')+' UTC':'unknown')+'. Modified: '+(md?md.toISOString().slice(0,16).replace('T',' ')+' UTC':'unknown')+'. Compare with a report you pull yourself.');

  if(updates>0) add('warn','incremental','Appended revisions found', updates+' later revision(s) are stacked on the original. Editors often save changes this way. Legitimate steps like signing or form-filling do too.');
  if(gap>120000) add('warn','mod_after_create','Modified after it was created','The modified time is '+Math.round(gap/60000)+' minutes after creation.');
  if(EDIT_TOOLS.test(toolText)) add((updates>0||gap>120000)?'high':'warn','editor_tool','Saved by an editing tool','The file names a PDF/graphics editor ('+(toolText.match(EDIT_TOOLS)[0])+'). A bureau report is normally generated by a server, not edited by hand.');
  else if(DESIGN_TOOLS.test(toolText)) add('warn','design_tool','Created in a word processor or design tool','Bureau reports are not normally produced this way.');
  else if(PRINT_TOOLS.test(toolText)) add('info','print_tool','Saved from a browser or printed to PDF','Common when an applicant saves their online report. The content could still have been altered before saving.');

  const hasText = inp.textOk && inp.hasText;

    const toks=String(inp.name||'').toLowerCase().split(/[^a-zÀ-ÿ]+/).filter(t=>t.length>=2);
    if(toks.length && !toks.every(t=>low.includes(t))) add('warn','name_mismatch','Applicant name not found','Not every part of "'+inp.name+'" appears in the document.');
    const kw=['score','inquir','account','trade','balance','payment','collection','credit'].filter(k=>low.includes(k)).length;
    if(kw<4) add('warn','few_keywords','Does not look like a full credit report','Only '+kw+' of 8 expected terms appear.');
    const score=String(inp.score||'').trim();
    if(score){
      const rx=new RegExp('(^|[^0-9])'+score+'([^0-9]|$)');
      const near=[]; let m; const r=/score[^0-9]{0,40}(\d{3})(?!\d)/gi;
      while((m=r.exec(text))){ const n=+m[1]; if(n>=300&&n<=900) near.push(String(n)); }
      if(near.length && !near.includes(score)) add('high','score_differs','Document shows a different score','The text near "score" reads '+[...new Set(near)].join(', ')+', not '+score+'.');
      else if(!rx.test(text)) add('warn','score_missing','Score not found as text','The entered score does not appear in the text layer. It may be drawn as an image, which is one way scores get altered.');
      else add('info','score_found','Entered score appears in the document','Found '+score+' in the text.');
      // font mismatch for body-sized score text
      const chars={}; items.forEach(i=>{ chars[i.fontName]=(chars[i.fontName]||0)+i.str.length; });
      const fonts=Object.keys(chars); const body=fonts.sort((a,b)=>chars[b]-chars[a])[0];

      const sItems=items.filter(i=>rx.test(i.str));
      if(fonts.length>=2 && med && sItems.some(i=>i.fontName!==body && Math.abs(i.height-med)/med<0.2))
        add('warn','score_font','Score uses a different font from the body text','The score is the same size as the body text but a different font, which can mean it was retyped. Large display fonts for the score are normal.');
    }
    const dates=extractDates(text).filter(d=>d.getUTCFullYear()>=2000);
    if(dates.length){
      const newest=new Date(Math.max.apply(null,dates.map(d=>+d)));
      const age=Math.round((now-newest)/86400000);
      if(age<-1) add('warn','future_date','A date in the document is in the future', newest.toISOString().slice(0,10)+'.');
      else if(age>30) add('warn','stale','Report is older than 30 days','The newest date found is '+newest.toISOString().slice(0,10)+' ('+age+' days ago). Ask for a current copy.');
      else add('info','date_ok','Recent date found', 'Newest date '+newest.toISOString().slice(0,10)+'.');
    } else add('info','no_date','No readable date found','Could not find a report date in the text.');
  }

}

async function ensurePdfJs(){

  const url='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function runDocCheck(file){
  const s=cur(); if(!file||!s) return;
  toast('Checking file...');
  const bytes=new Uint8Array(await file.arrayBuffer());
  let hash=''; try{ const h=await crypto.subtle.digest('SHA-256',bytes); hash=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){}

  const meta={info:{},xmp:{}}; let items=[], hasText=false, textOk=false;
  if(isPdf){
    try{
      const lib=await ensurePdfJs(); const doc=await lib.getDocument({data:bytes.slice()}).promise;
      try{ const md=await doc.getMetadata(); meta.info=md.info||{}; if(md.metadata){ ['xmp:creatortool','xmp:modifydate','xmp:createdate','pdf:producer'].forEach(k=>{ try{ const v=md.metadata.get(k); if(v) meta.xmp[k]=v; }catch(e){} }); } }catch(e){}
      for(let p=1;p<=Math.min(doc.numPages,10);p++){ const tc=await (await doc.getPage(p)).getTextContent(); tc.items.forEach(i=>items.push({str:i.str,fontName:i.fontName,height:i.height})); }
      hasText=items.some(i=>i.str.trim().length>0); textOk=true;
    }catch(e){ textOk=false; }
  }
  const res=analyzePdf({bytes,isPdf,meta,items,hasText,textOk,name:s.applicant.name,score:s.credit.score});
  s.docCheck=Object.assign({fileName:file.name,size:file.size,sha256:hash,checkedAt:nowISO()},res);
  s.updatedAt=nowISO(); save(); render(); toast('Check complete');
}

  {name:'Ontario Courts Public Portal (Toronto region)', url:'https://courts.ontario.ca/portal/home', note:'Party search for civil and small claims cases. Use only to search; do not save or share its content.'},
  {name:'Search court cases online (rest of Ontario)', url:'https://ontario.ca/page/search-court-cases-online', note:'Links to Justice Services Online, which needs a My Ontario Account.'},
  {name:'Bankruptcy and Insolvency Records Search', url:'https://ised-isde.canada.ca/site/office-superintendent-bankruptcy/en/bankruptcy-and-insolvency-records-search/bankruptcy-and-insolvency-records-search', note:'Minimum $8 per search, paid by credit card.'}

let LTB={meta:null,msg:'',busy:false};
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function compactLtb(rows){
  if(!rows.length) throw new Error('The file is empty');
  const h=rows[0].map(x=>String(x).toLowerCase().trim());
  const one=p=>h.findIndex(x=>x.startsWith(p));
  const many=p=>h.map((x,i)=>x.startsWith(p)?i:-1).filter(i=>i>=0);
  const ix={f:one('file number'),ap:one('applications'),at:one('application type'),ca:one('complex address'),ll:one('landlord name'),t:one('tenant name'),ft:one('former tenant name'),st:one('sub-tenant name'),oc:one('occupant name'),d:one('order date'),dt:one('document type'),u:one('contentdownload url')};
  const ua=many('rental unit address');
  if(ix.t<0||ix.at<0||ix.f<0) throw new Error('This does not look like the LTB Order Catalogue file (expected Tenant Name, Application Type and File Number columns).');
  const g=(r,i)=>i>=0&&r[i]!=null?String(r[i]).trim():'';
  const recs=[];
  for(let i=1;i<rows.length;i++){ const r=rows[i];
    recs.push({f:g(r,ix.f),ap:g(r,ix.ap),at:g(r,ix.at),ua:ua.map(k=>g(r,k)).filter(Boolean).join(' / '),ca:g(r,ix.ca),ll:g(r,ix.ll),t:g(r,ix.t),ft:g(r,ix.ft),st:g(r,ix.st),oc:g(r,ix.oc),d:g(r,ix.d),dt:g(r,ix.dt),u:g(r,ix.u)}); }
  return recs;
}
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('tenantScreening',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readonly'); const q=tx.objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function ingestLtb(text,source){

  const dates=recs.map(r=>r.d).filter(x=>/^\d{4}-\d{2}-\d{2}/.test(x)).map(x=>x.slice(0,10)).sort();
  const meta={source,loadedAt:nowISO(),rows:recs.length,minDate:dates[0]||'',maxDate:dates[dates.length-1]||''};

}

function normText(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function nameTokens(s){ return normText(s).replace(/[^a-z\s]/g,' ').split(/\s+/).filter(t=>t.length>=2&&!['jr','sr','ii','iii'].includes(t)); }
function addrParts(a){ const t=normText(a).replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean); const num=t.find(x=>/^\d+[a-z]?$/.test(x)); const st=t.find(x=>/^[a-z]{3,}$/.test(x)&&!['unit','apt','suite','street','avenue','road','drive'].includes(x)); return {num,st,tokens:new Set(t)}; }
function addrMatch(appAddr,recAddrs){ const a=addrParts(appAddr); if(!a.num||!a.st) return false; return recAddrs.some(r=>{ if(!r) return false; const p=addrParts(r); return p.tokens.has(a.num)&&p.tokens.has(a.st); }); }
function classifyApp(text){
  const t=String(text||'');
  const landlord=/\bL\s?-?\d{1,2}\b/i.test(t)||/landlord'?s? application|requ[eê]te du locateur/i.test(t);
  const tenant=/\bT\s?-?\d{1,2}\b/i.test(t)||/tenant'?s? application|requ[eê]te du locataire/i.test(t);
  const kind=landlord&&!tenant?'landlord':(tenant&&!landlord?'tenant':'other');
  return {kind, arrears:/\bL\s?-?(1|9|10)\b/i.test(t)};
}
function searchLtb(records,name,address){
  const t=nameTokens(name); if(t.length<2) return {error:'Enter the applicant\'s first and last name first.'};
  const first=t[0], last=t[t.length-1]; const out=[];
  for(const r of records){
    let role=null;
    for(const [k,lab] of [['t','Tenant'],['ft','Former tenant'],['st','Sub-tenant'],['oc','Occupant']]){
      const v=r[k]; if(!v) continue; const nv=normText(v); if(!nv.includes(first)||!nv.includes(last)) continue;
      const set=new Set(nameTokens(v)); if(set.has(first)&&set.has(last)){ role=lab; break; }
    }
    if(!role) continue;
    const c=classifyApp(r.at+' '+r.ap);
    out.push({file:r.f,appType:r.at||r.ap,date:r.d,address:r.ua||r.ca,role,addressMatch:addrMatch(address,[r.ua,r.ca]),kind:c.kind,arrears:c.arrears,url:r.u});

function ltbSummary(matches,meta){
  const cov='LTB Order Catalogue: '+meta.rows+' orders'+(meta.minDate?', '+meta.minDate+' to '+meta.maxDate:'')+'. Older orders are not yet published, so this is not a full history.';
  const adverse=matches.filter(m=>m.kind!=='tenant');
  if(!matches.length) return {status:'clear',flagged:false,text:'No match for the applicant\'s name. '+cov};
  if(!adverse.length) return {status:'clear',flagged:false,text:matches.length+' order(s) found, all from applications the applicant filed as tenant. '+cov};
  const strong=adverse.filter(m=>m.addressMatch).length, ar=adverse.filter(m=>m.arrears).length;
  return {status:'concern',flagged:true,text:adverse.length+' landlord application(s) name this applicant'+(ar?' ('+ar+' arrears-type)':'')+(strong?'; '+strong+' also match the applicant\'s address':'; none match the address, so this could be someone with the same name')+'. Confirm against the order itself. '+cov};
}
function ltbRecommendation(auto){

}

function pdfClean(s){ return String(s==null?'':s).replace(/[—–]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/≥/g,'>=').replace(/·/g,'|').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,''); }
function buildPdf(m, JsPDF){

  doc.setFillColor.apply(doc,INK); doc.rect(0,0,W,84,'F');

  if(m.outcome.final==='incomplete'){ doc.setTextColor(217,183,122); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('DRAFT - INCOMPLETE',W-M-110,40); }

  txt([m.applicant.email,m.applicant.phone,m.applicant.address].filter(Boolean).join('  |  '),{size:9,color:MUT,gap:8});
  // scorecard tiles
  const n=m.dims.length, gap=4, tw=(CW-gap*(n-1))/n; need(48);
  m.dims.forEach((d,i)=>{ const x=M+i*(tw+gap); const c=COL[d.status]; doc.setFillColor.apply(doc,c); doc.roundedRect(x,y,tw,40,3,3,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text(pdfClean(d.short),x+tw/2,y+17,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.text(pdfClean(STATUS_LABEL[d.status]),x+tw/2,y+30,{align:'center'}); });
  y+=52;
  // outcome box

  if(m.outcome.flags.length) lines.push('Concerns to review: '+m.outcome.flags.join(', '));
  if(m.outcome.justification) lines.push('Owner justification: '+m.outcome.justification);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  const wrapped=lines.map(l=>doc.splitTextToSize(pdfClean(l),ow)); const nl=wrapped.reduce((a,b)=>a+b.length,0);
  const bh=44+nl*13; need(bh+6);
  doc.setFillColor.apply(doc,TINT[m.outcome.final]); doc.rect(M,y,CW,bh,'F'); doc.setFillColor.apply(doc,COL[m.outcome.final]); doc.rect(M,y,6,bh,'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor.apply(doc,MUT);
  doc.text(pdfClean(m.outcome.overridden?'OWNER DECISION (OVERRIDE OF COMPUTED RESULT)':'RESULT AGAINST LOCKED CRITERIA'),M+18,y+16);
  doc.setFont('times','bold'); doc.setFontSize(18); doc.setTextColor.apply(doc,COL[m.outcome.final]); doc.text(pdfClean(OUTCOME_LABEL[m.outcome.final]),M+18,y+36);
  let ty=y+52; doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor.apply(doc,INK);
  wrapped.forEach(ls=>ls.forEach(l=>{ doc.text(l,M+18,ty); ty+=13; }));
  y+=bh+8;
  // criteria
  section('Criteria');
  txt(m.criteria.lockedAt?('Locked '+fmtDT(m.criteria.lockedAt)+' before any check was recorded. Minimum credit score '+m.criteria.minCredit+'. References required: '+(m.criteria.refRequired?'Yes':'No')+'.'):'Criteria were not locked.',{size:10});

  const colW=[142,66,117,CW-345];
  const cols=[M,M+150,M+222,M+345];
  need(20); doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor.apply(doc,MUT);
  ['DIMENSION','RESULT','SOURCE / DATE','DETAILS'].forEach((h,i)=>doc.text(h,cols[i],y+8)); y+=14;
  m.dims.forEach(d=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    const a=doc.splitTextToSize(pdfClean(d.name),colW[0]);
    const b=doc.splitTextToSize(pdfClean([d.source||'-', d.date?fmtDate(d.date):''].filter(Boolean).join('\n')),colW[2]);
    const c=doc.splitTextToSize(pdfClean(d.awaitingConsent?'Consent not given':(d.note||'')),colW[3]);

    doc.setFillColor.apply(doc,COL[d.status]); doc.roundedRect(cols[1],y+1,Math.max(cwid,50),12,6,6,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.text(pdfClean(st),cols[1]+Math.max(cwid,50)/2,y+9.5,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor.apply(doc,INK); doc.text(b,cols[2],y+9); doc.text(c,cols[3],y+9);

    m.ltbAuto.matches.slice(0,10).forEach(x=>txt('File '+x.file+' | '+x.appType+' | '+x.date+' | '+(x.addressMatch?'name + address':'name only'),{size:9}));
    if(m.ltbAuto.flagged&&m.ltbRec){ txt(m.ltbRec.title+':',{size:9.5,bold:true}); m.ltbRec.steps.forEach(x=>txt('- '+x,{size:9})); }
  }
  // authenticity
  if(m.docCheck || m.sourceVerified.method || m.attestation.given){
    section('Credit report authenticity');
    if(m.docCheck){
      const TC={clean:COL.met,warn:COL.review,high:COL.not_met,unassessable:COL.incomplete};
      txt('Result: '+TIER_LABEL[m.docCheck.tier],{size:10.5,bold:true,color:TC[m.docCheck.tier]});
      txt('File: '+m.docCheck.fileName+'  |  SHA-256: '+(m.docCheck.sha256||'').slice(0,16)+'  |  Checked '+fmtDT(m.docCheck.checkedAt),{size:8.5,color:MUT,gap:3});
      m.docCheck.findings.filter(x=>x.level!=='info').forEach(x=>txt('['+LEVEL_LABEL[x.level]+'] '+x.title+'. '+x.detail,{size:9,color:x.level==='high'?COL.not_met:INK}));
    }
    txt(attestLine(m),{size:9.5});
    txt(verifyLine(m),{size:9.5,bold:true});
    txt('Automated checks for signs of editing. They are not proof of authenticity.',{size:8.5,color:MUT});
  }
  if(m.prelim){
    section('Employment: preliminary verification');
    txt(({pass:'Preliminary pass',fail:'Documents disagree',inconclusive:'Inconclusive: employer email recommended'})[m.prelim.result]+'  |  score '+m.prelim.score+'/100  |  '+(m.prelim.employer||'')+'  |  web search: '+(m.prelim.provider||'none'),{size:9.5,bold:true,color:m.prelim.result==='pass'?COL.met:m.prelim.result==='fail'?COL.not_met:COL.review});
    m.prelim.signals.forEach(c=>txt((c.st==='ok'?'[OK] ':c.st==='bad'?'[PROBLEM] ':c.st==='warn'?'[CHECK] ':'[TO DO] ')+c.txt,{size:9,color:c.st==='bad'?COL.not_met:INK}));
    txt('Based on payslip data and public web results about the employer. Not confirmed with the employer unless stated in the Employment check.',{size:8.5,color:MUT});
  }
  if(m.docs){
    section('Documents read automatically');
    m.docs.list.forEach(x=>{ txt(x.type+' ('+x.fileName+(x.method==='ocr'?', OCR':'')+')',{size:9.5,bold:true,gap:1}); txt(x.summary||'-',{size:8.5,color:MUT,gap:3}); });
    m.docs.manual.forEach(x=>txt('[MANUAL] '+x.section+': '+x.state,{size:9,bold:true,color:COL.review}));
    m.docs.checks.forEach(c=>txt((c.lvl==='ok'?'[OK] ':c.lvl==='bad'?'[PROBLEM] ':c.lvl==='warn'?'[CHECK] ':'[NOTE] ')+c.txt,{size:9,color:c.lvl==='bad'?COL.not_met:INK}));

}
function downloadPdf(){
  const s=cur(); const m=reportModel(s);
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J){ toast('PDF library did not load (offline?). Using Print instead.'); window.print(); return; }
  const doc=buildPdf(m,J);
  const nm=(s.applicant.name||'applicant').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  doc.save('screening-'+nm+'-'+todayISO()+'.pdf'); toast('PDF downloaded');
}


/* ======================= DOCUMENT READER (v2) ======================= */
/* Reads uploaded documents on this computer (PDF text, or OCR for photos/scans), recognises the type,
   pulls out the fields, cross-checks them, and proposes values for the checks. Nothing is uploaded anywhere.
   Only the extracted fields are kept, never the image or the full text. */
const DOC_TYPES={id:'Photo ID',paystub:'Paystub',noa:'CRA Notice of Assessment',t4:'T4 slip',letter:'Employment letter',credit:'Credit report',bank:'Bank statement',lease:'Previous lease',osb:'OSB insolvency search result',police:'Police record check (applicant-supplied)',court:'Court records search result',other:'Unrecognized document'};
const DOC_MEM={}; const DOC_ST={busy:false,applied:[]};
const PADDLE_OCR_URL='https://cdn.jsdelivr.net/npm/@paddlejs-models/ocr/dist/ocr.js';

/* ---------- text helpers ---------- */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const NUM_RX=/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g;
function dnum(x){ if(x==null) return null; const n=parseFloat(String(x).replace(/[$,\s]/g,'')); return isFinite(n)?n:null; }
function numsIn(str){ return (String(str||'').match(NUM_RX)||[]).map(dnum).filter(n=>n!=null); }
function iso(y,m,d){ y=+y;m=+m;d=+d; if(y<1990||y>2100||m<1||m>12||d<1||d>31) return null; return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function datesIn(str){
  str=String(str||''); const out=[]; let m;

  const base=d.method==='ocr'?(d.conf!=null?d.conf:65):97; const f=d.f, out={};
  (FIELD_SPEC[d.type]||[]).forEach(sp=>{
    if(sp.t==='ro'||sp.t==='mrz') return; const v=specVal(sp,f); if(v==null||v==='') return;
    let c=base;
    if(d.over&&d.over[sp.k]) c=100;
    else{
      if(d.guess&&d.guess[sp.k]) c*=0.8;
      if(d.type==='id'&&f.mrzValid===true&&(sp.k==='name'||sp.k==='expiry')) c=Math.max(c,99);
      if(d.type==='id'&&f.mrzValid===false) c=Math.min(c,40);
      if((sp.k==='name'||sp.k==='employee'||sp.k==='tenant')&&nameMatch(s.applicant.name,v)==='match') c=Math.min(100,c+10);
      if(d.type==='paystub'&&(d.notes||[]).some(n=>n.lvl==='bad')&&['gross','net','ytd'].includes(sp.k)) c*=0.7;
    }

function docScore(s,d){

  const spec=(FIELD_SPEC[d.type]||[]).filter(x=>x.t!=='ro'&&x.t!=='mrz'&&x.t!=='derived'); const fc=fieldConfs(s,d);
  const found=spec.filter(x=>fc[x.k]!=null); if(!found.length) return 0;
  const crit=spec.filter(x=>x.c), cf=crit.filter(x=>fc[x.k]!=null).length; const avg=found.reduce((a,x)=>a+fc[x.k],0)/found.length;

function docLow(s,d){ return d.type!=='other'&&docScore(s,d)<LOW_CONF; }
function confColor(n){ return n>=85?'var(--green)':n>=LOW_CONF?'var(--amber)':'var(--red)'; }
function confChip(n){ return `<span class="chip" style="background:${confColor(n)}">${n}%</span>`; }

/* ---------- manual verification and override, per section ---------- */
function dimLowDocs(s,key){ return (s.docs||[]).filter(d=>(DIM_DOCS[key]||[]).includes(d.type)&&docLow(s,d)); }
function dimEdited(s,key){ const out=[]; (s.docs||[]).filter(d=>(DIM_DOCS[key]||[]).includes(d.type)).forEach(d=>Object.keys(d.over||{}).forEach(k=>{ const sp=(FIELD_SPEC[d.type]||[]).find(x=>x.k===k); out.push({doc:d,label:(sp?sp.l:k),from:d.over[k].from,to:d.over[k].to}); })); return out; }

function dimBlocked(s,key){ return dimLowDocs(s,key).length>0&&!dimAccepted(s,key); }
function manualBannerHtml(s,key){

    <label class="consent" style="margin:6px 0 0"><input type="checkbox" ${m.verified?'checked':''} onchange="setvR('${p}verified',this.checked)"><span>Manually verified: I compared these values with the original document and they are correct.</span></label>
    <label class="consent" style="margin:4px 0 0"><input type="checkbox" ${m.override?'checked':''} onchange="setvR('${p}override',this.checked)"><span>Override: proceed with the values as read. My reason is recorded in the report.</span></label>
    ${m.override?`<div class="field" style="margin:6px 0 0"><label>Reason for override (minimum 10 characters)</label><textarea rows="2" onchange="setvR('${p}note',this.value)">${esc(m.note||'')}</textarea></div>`:''}`;
  }
  if(ed.length) h+=`<div style="margin-top:6px"><b>Edited by you:</b> ${ed.map(e=>esc(e.label)+': '+esc(String(e.from===''?'(blank)':e.from))+' → '+esc(String(e.to===''?'(blank)':e.to))).join('; ')}</div>`;

}

/* ---------- section checklists (check marks) ---------- */

function sectionChecks(s,key){

    const d=by('credit')[0]; add(d?'ok':'todo',d?'Credit report added':'Credit report not added yet');
    if(s.credit.score!==''&&s.credit.score!=null&&s.criteria.minCredit!=='') add(Number(s.credit.score)>=Number(s.criteria.minCredit)?'ok':'bad','Score '+s.credit.score+(Number(s.credit.score)>=Number(s.criteria.minCredit)?' meets':' is below')+' the locked minimum of '+s.criteria.minCredit);

      add(ps.every(d=>d.f.payDate&&ageDays(d.f.payDate)<=60)?'ok':'warn',ps.every(d=>d.f.payDate&&ageDays(d.f.payDate)<=60)?'Paystubs are within 60 days':'A paystub is over 60 days old or undated'); }

function sectionChecksHtml(s,key){ return marksHtml(sectionChecks(s,key)); }

/* ---------- cross-checks and estimates ---------- */
function ageDays(iso0){ return Math.round((Date.now()-new Date(iso0+'T12:00:00'))/86400000); }
function incomeEstimate(s){
  const D=s.docs||[]; const ps=D.filter(d=>d.type==='paystub'&&d.f.monthly);
  if(ps.length) return {monthly:Math.round(ps.reduce((a,d)=>a+d.f.monthly,0)/ps.length*100)/100,basis:'Paystubs ('+ps.length+'), gross pay annualized'};
  const l=D.find(d=>d.type==='letter'&&d.f.annual); if(l) return {monthly:Math.round(l.f.annual/12*100)/100,basis:'Employment letter, stated salary'};
  const n=D.find(d=>d.type==='noa'&&d.f.totalIncome); if(n) return {monthly:Math.round(n.f.totalIncome/12*100)/100,basis:'Notice of Assessment '+(n.f.year||'')+', total income / 12 (prior year)'};
  const t=D.find(d=>d.type==='t4'&&d.f.employment); if(t) return {monthly:Math.round(t.f.employment/12*100)/100,basis:'T4 '+(t.f.year||'')+', employment income / 12 (prior year)'};

}
function docChecks(s){
  const D=s.docs||[]; const out=[]; const add=(lvl,txt,ids)=>out.push({lvl,txt,ids:ids||[]}); const app=s.applicant.name; const by=t=>D.filter(d=>d.type===t);
  D.forEach(d=>{
    const nm=d.f.name||d.f.employee||d.f.tenant; let r=null;
    if(nm&&app) r=nameMatch(app,nm); else if(d.nameHit===true) r='match'; else if(d.nameHit===false) r='notfound';
    const L=DOC_TYPES[d.type];
    if(d.type!=='other'){
      if(r==='match') add('ok',L+': name matches the application.',[d.id]);
      else if(r==='partial') add('warn',L+': name only partly matches ("'+(nm||'')+'"). Compare by eye.',[d.id]);
      else if(r==='mismatch') add('bad',L+': the applicant\'s name does not match (document says "'+nm+'").',[d.id]);
      else if(r==='notfound') add('warn',L+': the applicant\'s name was not found in the text. Check the document by eye.',[d.id]);
    }
    (d.notes||[]).forEach(n=>add(n.lvl,L+': '+n.txt,[d.id]));
    if(d.auth&&d.auth.tier==='high') add('bad',L+' "'+d.fileName+'": signs of editing ('+d.auth.flags.filter(x=>x.level!=='info').map(x=>x.title).join('; ')+').',[d.id]);
    else if(d.auth&&d.auth.tier==='warn') add('warn',L+' "'+d.fileName+'": '+d.auth.flags.filter(x=>x.level!=='info').map(x=>x.title).join('; ')+'.',[d.id]);
    else if(d.auth&&d.auth.tier==='clean') add('ok',L+': no signs of editing in the file history.',[d.id]);
    if(['osb','court','police'].includes(d.type)){ if(d.f.result==='found') add('warn',L+': the document reports a record. Read it yourself; this is for your review, not an automatic decision.',[d.id]); else if(d.f.result==='none') add('ok',L+': reports no record.',[d.id]); else add('warn',L+': the result could not be read clearly.',[d.id]); if(d.f.date&&ageDays(d.f.date)>30) add('warn',L+' is dated '+d.f.date+' (more than 30 days old).',[d.id]); }
    if(d.type==='other') add('warn','"'+d.fileName+'" was not recognized. Choose its type in the list, or remove it.',[d.id]);
  });
  const idd=by('id')[0];
  if(!idd) add('info','No ID uploaded yet.'); else {
    if(idd.f.mrzValid===false) add('bad','ID: the machine-readable zone failed its check digits, which usually means a misread or an altered document.',[idd.id]);
    else if(idd.f.mrzValid===true) add('ok','ID: machine-readable zone check digits are valid.',[idd.id]);
    if(!idd.f.expiry) add('warn','ID: expiry date could not be read.',[idd.id]); else if(idd.f.expiry<todayISO()) add('bad','ID: expired on '+idd.f.expiry+'.',[idd.id]); else if(ageDays(idd.f.expiry)>-60) add('warn','ID: expires soon ('+idd.f.expiry+').',[idd.id]); else add('ok','ID: not expired (expires '+idd.f.expiry+').',[idd.id]);
  }
  const ps=by('paystub');
  if(ps.length===1) add('warn','Only one paystub. Two or three consecutive stubs are a better basis.',[ps[0].id]);
  ps.forEach(d=>{ if(d.f.payDate&&ageDays(d.f.payDate)>60) add('warn','Paystub dated '+d.f.payDate+' is more than 60 days old.',[d.id]); else if(d.f.payDate) add('ok','Paystub dated '+d.f.payDate+' is recent.',[d.id]); if(!d.f.gross) add('warn','Paystub "'+d.fileName+'": gross pay could not be read.',[d.id]); if(d.f.gross&&!(d.notes||[]).some(n=>n.lvl==='bad')&&d.f.net) add('ok','Paystub: gross, deductions, net and year-to-date are consistent.',[d.id]); });
  const lt=by('letter')[0];
  if(lt&&ps.length){ const same=orgSame(lt.f.employer,ps[0].f.employer); if(same===true) add('ok','Employer name on the letter and the paystub agree.',[lt.id,ps[0].id]); else if(same===false) add('bad','Employer on the letter ("'+lt.f.employer+'") differs from the paystub ("'+ps[0].f.employer+'").',[lt.id,ps[0].id]); }
  if(lt&&lt.f.annual&&ps.filter(d=>d.f.monthly).length){ const m=ps.filter(d=>d.f.monthly); const pa=m.reduce((a,d)=>a+d.f.monthly,0)/m.length*12; const diff=Math.abs(lt.f.annual-pa)/pa; if(diff>0.2) add('warn','Salary on the letter ($'+Math.round(lt.f.annual).toLocaleString()+'/yr) differs by '+Math.round(diff*100)+'% from the paystub ($'+Math.round(pa).toLocaleString()+'/yr).',[lt.id]); else add('ok','Salary on the letter is consistent with the paystub.',[lt.id]); }
  if(lt&&lt.f.phone) add('info','Employment letter lists '+lt.f.phone+'. Do not rely on it: look up the employer\'s published number yourself.',[lt.id]);
  const bk=by('bank')[0];
  if(bk&&ps.length&&bk.f.payroll&&bk.f.payroll.length){ const nets=ps.map(d=>d.f.net).filter(Boolean); const hit=nets.some(n=>bk.f.payroll.some(p=>Math.abs(p.amt-n)/n<0.03)); if(nets.length){ if(hit) add('ok','A paystub net amount matches a payroll deposit on the bank statement.',[bk.id]); else add('warn','No payroll deposit on the bank statement matches a paystub net amount.',[bk.id]); } }

  const pa2=ps.filter(d=>d.f.monthly); const noa=by('noa')[0], t4=by('t4')[0];
  if(pa2.length&&(noa||t4)){ const yr=(noa&&noa.f.totalIncome)||(t4&&t4.f.employment); const cur12=pa2.reduce((a,d)=>a+d.f.monthly,0)/pa2.length*12; if(yr) add('info','Last tax year income $'+Math.round(yr).toLocaleString()+' vs current paystub pace $'+Math.round(cur12).toLocaleString()+'/yr.',[(noa||t4).id]); }
  const cr=by('credit')[0];
  if(cr){ if(cr.f.reportDate){ const a=ageDays(cr.f.reportDate); if(a>30) add('warn','Credit report is '+a+' days old. Ask for one from the last 30 days.',[cr.id]); else add('ok','Credit report is recent ('+cr.f.reportDate+').',[cr.id]); } else add('warn','Credit report date could not be read.',[cr.id]);
    if(cr.f.score==null) add('warn','Credit score could not be read from the report.',[cr.id]); else add('ok','Credit score read from the report ('+cr.f.score+').',[cr.id]); if(cr.f.bankruptcy) add('warn','Credit report mentions bankruptcy or a consumer proposal. Review the report itself.',[cr.id]); if(cr.f.collections>0) add('warn','Credit report shows '+cr.f.collections+' collection item(s).',[cr.id]); }
  D.forEach(d=>{ if(d.type==='other') return; const sc=docScore(s,d); if(sc<LOW_CONF) add('warn',DOC_TYPES[d.type]+' "'+d.fileName+'": reading confidence is '+sc+'% (below '+LOW_CONF+'%). Verify manually in the section it feeds.',[d.id]); else add('ok',DOC_TYPES[d.type]+': read at '+sc+'% confidence.',[d.id]); });
  const missing=[]; if(!idd) missing.push('ID'); if(!ps.length&&!lt&&!noa&&!t4) missing.push('income proof (paystubs, employment letter, or tax slip)'); if(!cr) missing.push('credit report');

}
function docFieldRows(d){ return (FIELD_SPEC[d.type]||[]).map(sp=>[sp.l,fmtField(sp,d.f)]); }
function docSummary(s,d){ const f=docFieldRows(d).filter(r=>r[1]!=null).slice(0,6).map(r=>r[0]+': '+r[1]).join(' | '); return 'Confidence '+docScore(s,d)+'%'+(Object.keys(d.over||{}).length?' (edited by owner: '+Object.keys(d.over).join(', ')+')':'')+(f?' | '+f:''); }
function manualSummary(s){
  const out=[]; Object.keys(DIM_DOCS).forEach(k=>{ const low=dimLowDocs(s,k), ed=dimEdited(s,k); if(!low.length&&!ed.length) return; const m=manualState(s,k);
    let st=''; if(low.length) st=m.verified?'low confidence, manually verified by owner':(m.override&&String(m.note||'').trim().length>=10)?'low confidence, owner override: '+m.note.trim():'low confidence, NOT yet verified'; if(ed.length) st+=(st?'; ':'')+'values edited by owner ('+ed.map(e=>e.label).join(', ')+')'; out.push({section:DIM_NAME[k],state:st}); });

/* ---------- owner edits ---------- */
function rederive(d){
  if(d.type==='paystub'){ d.notes=paystubDerive(d.f); }
  if(d.type==='letter'&&d.f.annual!=null) d.f.payText='$'+Number(d.f.annual).toLocaleString()+' per year';
}
function setDocField(id,k,raw){
  const s=cur(); const d=(s.docs||[]).find(x=>x.id===id); if(!d) return; const sp=(FIELD_SPEC[d.type]||[]).find(x=>x.k===k); if(!sp) return;
  let v=String(raw).trim();
  if(sp.t==='$'||sp.t==='num'){ if(v===''){ v=null; } else { const n=dnum(v); if(n==null){ toast('Enter a number'); render(); return; } v=n; } }
  else if(sp.t==='date'){ if(v===''){ v=null; } else if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ const dd=firstDate(v); if(!dd){ toast('Use the date format YYYY-MM-DD'); render(); return; } v=dd; } }
  else if(sp.t==='freq'||sp.t==='result'){ v=v||null; }
  else if(v==='') v=null;
  const prior=(d.over&&d.over[k])?d.over[k].from:(d.f[k]==null?'':d.f[k]);
  if(String(prior)===String(v==null?'':v)){ if(d.over&&d.over[k]) delete d.over[k]; d.f[k]=v==null?undefined:v; rederive(d); s.updatedAt=nowISO(); save(); render(); return; }
  d.over=d.over||{}; d.over[k]={from:prior,to:v==null?'':v,at:nowISO()}; d.f[k]=v==null?undefined:v; rederive(d);
  s.updatedAt=nowISO(); save(); render(); toast('Value edited. It is flagged as an owner edit.');
}
function resetDocField(id,k){ const s=cur(); const d=(s.docs||[]).find(x=>x.id===id); if(!d||!d.over||!d.over[k]) return; const f=d.over[k].from; d.f[k]=(f===''||f==null)?undefined:f; delete d.over[k]; rederive(d); s.updatedAt=nowISO(); save(); render(); }

/* ---------- apply to checks ---------- */
async function applyDocs(){
  const s=cur(); if(!s) return; const D=s.docs||[]; const by=t=>D.filter(d=>d.type===t); const log=[]; const today=todayISO();
  const conf=s.docConfirm||{}; const cons=k=>!!(s.consents&&s.consents[k]&&s.consents[k].given);
  s.checks=s.checks||{};
  const blocked=(key,label)=>{ if(dimBlocked(s,key)){ log.push(label+': skipped, '+dimLowDocs(s,key).map(d=>DOC_TYPES[d.type]+' '+docScore(s,d)+'%').join(', ')+' is below '+LOW_CONF+'%. Verify manually or override in that section first.'); return true; } return false; };
  const idd=by('id')[0];
  if(idd&&!blocked('identity','Identity')){
    const nm=nameMatch(s.applicant.name,idd.f.name), exp=idd.f.expiry, expired=!!exp&&exp<today, bad=idd.f.mrzValid===false;
    const ok=nm==='match'&&!!exp&&!expired&&!bad;
    const status=(nm==='mismatch'||expired||bad)?'concern':(ok&&conf.idPhoto?'clear':'unchecked');
    s.checks.identity={status,source:'ID copy supplied by applicant',date:today,note:'Auto-read from '+(idd.f.kind||'ID')+' copy ('+docScore(s,idd)+'% confidence'+(dimAccepted(s,'identity')&&dimLowDocs(s,'identity').length?', accepted by owner':'')+'): name '+(nm||'not read')+', '+(exp?'expires '+exp+(expired?' (EXPIRED)':''):'expiry not read')+(bad?'; machine-readable zone failed its check digits':'')+'.'+(ok&&!conf.idPhoto?' Tick "I compared the ID photo with the applicant" to mark this clear.':'')};
    log.push('Identity: '+(status==='clear'?'clear':status==='concern'?'concern':'noted, waiting for your photo comparison'));
  }
  const cr=by('credit')[0];
  if(cr){
    if(!cons('credit')) log.push('Credit: skipped, record the credit-check consent first');
    else if(!blocked('credit','Credit')){
      if(cr.f.score!=null) s.credit.score=String(cr.f.score);
      s.checks.credit={status:'unchecked',source:cr.f.bureau==='TransUnion'?'TransUnion Canada (applicant-supplied)':'Equifax Canada (applicant-supplied)',date:cr.f.reportDate||today,note:'Auto-read from uploaded report ('+docScore(s,cr)+'% confidence)'+(cr.f.score==null?'; score could not be read, enter it':'')+(cr.f.collections?'; '+cr.f.collections+' collection item(s)':'')+'.'};
      log.push('Credit: '+(cr.f.score!=null?'score '+cr.f.score+' filled in':'score not found'));
      const mem=DOC_MEM[cr.id];
      if(mem&&mem.file&&/\.pdf$/i.test(cr.fileName)){ try{ await runDocCheck(mem.file); log.push('Credit report authenticity check run'); }catch(e){} }
    }
  }
  const est=incomeEstimate(s);
  if(est){ if(!cons('credit')) log.push('Income: skipped, income is collected alongside the credit check (consent needed)'); else if(!blocked('income','Income')){ s.income.monthly=String(est.monthly); s.income.basis=est.basis+(dimEdited(s,'income').length?', with owner edits':''); log.push('Income: '+fmtMoney(est.monthly)+'/month ('+est.basis+'). Your yes/no on affordability is still yours to answer.'); } }
  const autoNote=c=>!c||!c.note||/^Auto-read/.test(c.note);
  if(est&&cons('credit')&&!dimBlocked(s,'income')){
    const used=[['paystub','Recent paystubs'],['letter','Employment letter'],['noa','CRA Notice of Assessment'],['t4','T4 slip'],['bank','Bank statements']].filter(([ty])=>by(ty).length);
    const dates=[].concat(by('paystub').map(d=>d.f.payDate),by('bank').map(d=>d.f.periodEnd)).filter(Boolean).sort();
    const prev=s.checks.income||{}; const r=s.rental.rent?Math.round(Number(s.rental.rent)/est.monthly*100):null;
    if(autoNote(prev)) s.checks.income=Object.assign({},prev,{source:used.map(x=>x[1]).join(' + '),date:dates.length?dates[dates.length-1]:today,note:'Auto-read from '+used.map(x=>x[1].toLowerCase()).join(', ')+': '+fmtMoney(est.monthly)+'/month ('+est.basis+')'+(r?'; rent is '+r+'% of income (information only)':'')+'. Affordability yes/no is the owner\'s call.'});
  }
  const lt=by('letter')[0], ps=by('paystub')[0];
  if(lt||ps){
    if(!cons('employment')) log.push('Employment: skipped, record the employer-contact consent first');
    else if(!blocked('employment','Employment')){
      setBusy('Checking the employer online...'); try{ await computePrelim(s); }catch(e){ console.error(e); }
      const ev=employmentEvidence(s); const emp=(lt&&lt.f.employer)||(ps&&ps.f.employer)||'';
      s.checks.employment={status:ev.status,source:ev.source,date:today,note:ev.note,prelim:ev.prelim};
      s.mail=s.mail||{}; const e0=s.mail.employer||(s.mail.employer={}); if(!e0.org&&emp) e0.org=emp; if(!e0.title&&lt&&lt.f.title) e0.title=lt.f.title; if(!e0.start&&lt&&lt.f.start) e0.start=lt.f.start;
      log.push('Employment: '+ev.log+(s.prelim?' (preliminary score '+s.prelim.score+'/100)':''));
    }
  }
  [['osb','bankruptcy','public','OSB Bankruptcy and Insolvency search','Bankruptcy'],['court','court','public','Ontario Courts Public Portal (Toronto region)','Court records'],['police','police','police','Applicant-obtained police record check','Police record check']].forEach(([ty,key,cn,src,lab])=>{
    const d=by(ty)[0]; if(!d) return; if(!cons(cn)) { log.push(lab+': skipped, record the matching consent first'); return; } if(blocked(key,lab)) return;
    const sn=d.f.subject?nameMatch(s.applicant.name,d.f.subject):(d.nameHit===true?'match':d.nameHit===false?'notfound':null); const fresh=d.f.date&&ageDays(d.f.date)<=30;
    const status=d.f.result==='found'?'concern':(d.f.result==='none'&&(sn==='match')&&fresh?'clear':'unchecked');
    s.checks[key]={status,source:src,date:d.f.date||today,note:'Auto-read from the uploaded document ('+docScore(s,d)+'% confidence): '+(RESULT_LABEL[d.f.result]||'result not read')+(sn&&sn!=='match'?'; name '+(sn==='partial'?'partly matches':'does not match or was not found'):'')+(d.f.date&&!fresh?'; dated '+d.f.date+' (over 30 days)':'')+'.'};
    log.push(lab+': '+(status==='clear'?'clear':status==='concern'?'concern, a record is reported: review it':'noted, not cleared (name or date needs your check)'));
  });
  const ls=by('lease')[0];
  if(ls){ const prev=s.checks.references||{}; if(autoNote(prev)) s.checks.references=Object.assign({status:'unchecked'},prev,{source:'Previous lease supplied by applicant',date:ls.f.end||today,note:'Auto-read from the previous lease ('+docScore(s,ls)+'% confidence): landlord '+(ls.f.landlord||'not read')+', '+(ls.f.address||'address not read')+(ls.f.rent?', rent '+fmtMoney(ls.f.rent):'')+(ls.f.start?', from '+ls.f.start:'')+(ls.f.end?' to '+ls.f.end:'')+'. A lease shows tenancy, not conduct: contact the landlord to confirm.'}); }
  if(idd&&idd.f.name){ if(!s.applicant.name){ s.applicant.name=idd.f.name; log.push('Applicant name filled in from the ID'); } else { const a=String(s.applicant.name).trim().toLowerCase(), b=String(idd.f.name).trim().toLowerCase(); if(a!==b&&nameMatch(s.applicant.name,idd.f.name)!=='mismatch'){ s.pack=s.pack||{}; const have=String(s.pack.prev||''); if(!have.toLowerCase().includes(b)){ s.pack.prev=(have?have+'; ':'')+idd.f.name; log.push('Name on the ID added as a name to search: '+idd.f.name); } } } }
  if(ls){ s.mail=s.mail||{}; const l0=s.mail.landlord||(s.mail.landlord={}); if(!l0.org&&ls.f.landlord) l0.org=ls.f.landlord; if(!l0.address&&ls.f.address) l0.address=ls.f.address; if(!l0.from&&ls.f.start) l0.from=ls.f.start; if(!l0.to&&ls.f.end) l0.to=ls.f.end; log.push('Rental history: landlord email panel prefilled from the lease. A lease is not a reference, so contact the landlord.'); }
  if(!log.length) log.push('Nothing to apply yet. Add documents first.');
  DOC_ST.applied=log; s.updatedAt=nowISO(); save(); render(); toast('Applied to the checks');
}

/* ---------- panel ---------- */
function privacyBannerHtml(){
  return `<div role="note" style="background:#E3EFE7;border:2px solid var(--green);border-radius:4px;padding:12px 14px;margin:0 0 12px">
    <div style="font-weight:700;font-size:16px;color:#1f4a35">🔒 Your uploaded data stays in your browser at all times.</div>
    <div style="margin-top:4px"><b>Uploaded files are never transmitted to any server and the files themselves are never saved.</b> They are read on this device and discarded. Only the extracted fields (names, amounts, dates) are kept, in this browser's own storage on your device, until you delete the screening. They are not sent to us or anyone else.</div>
    <div class="hint" style="margin:6px 0 0">The only things that leave your device are public lookups that contain no applicant data: the employer's name and city for the web search, and downloads of the OCR and PDF tools and the public LTB catalogue.</div></div>`;
}
function docCardHtml(s,d){

  const feeds=Object.keys(DIM_DOCS).filter(k=>DIM_DOCS[k].includes(d.type));
  const fields=spec.filter(sp=>!(sp.t==='mrz'&&d.f[sp.k]==null)).map(sp=>{
    const v=specVal(sp,d.f); const edited=d.over&&d.over[sp.k]; const c=fc[sp.k];
    let input;
    if(sp.t==='ro'||sp.t==='mrz'||sp.t==='derived') input=`<div style="padding:7px 0;${v==null||v===''?'color:var(--amber)':''}">${v==null||v===''?'not found':esc(fmtField(sp,d.f))}</div>`;
    else if(sp.t==='result') input=`<select onchange="setDocField('${d.id}','${sp.k}',this.value)"><option value="">not found</option>${Object.keys(RESULT_LABEL).map(k=>`<option value="${k}" ${d.f[sp.k]===k?'selected':''}>${RESULT_LABEL[k]}</option>`).join('')}</select>`;
    else if(sp.t==='freq') input=`<select onchange="setDocField('${d.id}','${sp.k}',this.value)"><option value="">not found</option>${Object.keys(FREQ_LABEL).map(k=>`<option value="${k}" ${d.f[sp.k]===k?'selected':''}>${FREQ_LABEL[k]}</option>`).join('')}</select>`;
    else input=`<input type="text" value="${esc(v==null?'':v)}" placeholder="not found" style="${(v==null||v==='')?'border-color:var(--amber)':''}" onchange="setDocField('${d.id}','${sp.k}',this.value)">`;
    return `<div><div class="hint" style="margin:0 0 2px;text-transform:uppercase;font-size:11px;letter-spacing:.04em;display:flex;justify-content:space-between;gap:6px"><span>${esc(sp.l)}${sp.c?' *':''}</span><span>${c!=null?`<b style="color:${confColor(c)}">${c}%</b>`:''}</span></div>${input}${edited?`<div class="hint" style="margin:2px 0 0;color:var(--amber)">Edited by you (was ${esc(String(edited.from===''?'blank':edited.from))}) <a href="#" onclick="resetDocField('${d.id}','${sp.k}');return false">undo</a></div>`:''}</div>`;
  }).join('');
  const marks=docChecks(s).filter(c=>c.ids.includes(d.id)).map(c=>({st:c.lvl,txt:c.txt}));
  return `<div class="dim" style="${low?'border-color:var(--red)':''}"><div class="dim-h"><div><b>${esc(DOC_TYPES[d.type])}</b> ${d.type==='other'?'':confChip(sc)}<span class="badge">${esc(d.fileName)} · ${d.method==='ocr'?'read by OCR (engine '+(d.conf!=null?d.conf:'?')+'%)':'text read'}</span></div>
      <div class="actions noprint" style="display:flex;gap:6px;align-items:center"><select style="width:auto" onchange="reclassifyDoc('${d.id}',this.value)">${Object.keys(DOC_TYPES).map(k=>`<option value="${k}" ${d.type===k?'selected':''}>${esc(DOC_TYPES[k])}</option>`).join('')}</select><button class="small danger" onclick="removeDoc('${d.id}')">Remove</button></div></div>
    ${low?`<div class="note" style="border-left:4px solid var(--red)"><b>Low confidence (${sc}%).</b> Compare each value with the original and fix any that are wrong. Then mark the section manually verified${feeds.length?' ('+feeds.map(k=>DIM_NAME[k]).join(', ')+')':''}.</div>`:''}
    ${spec.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 14px;margin-top:8px">${fields}</div><div class="hint" style="margin-top:6px">* critical field. Percentages show how sure the reader is of each value. Type over a value to correct it; it is then flagged as an owner edit.</div>`:''}
    ${marksHtml(marks)}
    ${d.auth&&d.auth.flags.length?`<div class="hint">File check: ${d.auth.flags.map(x=>esc(x.title)).join('; ')}</div>`:''}</div>`;

/* ---------- Checklist of documents to collect ---------- */
const DOC_LIST=[

  {type:'credit',tier:'req',name:'Credit report',eg:'Equifax or TransUnion PDF, no older than 30 days',feeds:['credit'],from:'Applicant (needs their credit consent)'},
  {type:'paystub',tier:'req',name:'Recent paystubs (2 or more)',eg:'Latest two or three pay periods',feeds:['income','employment'],from:'Applicant',alt:['noa','t4']},
  {type:'letter',tier:'rec',name:'Employment letter',eg:'Employer, role, start date, pay, on letterhead',feeds:['employment','income'],from:'Applicant or employer'},
  {type:'bank',tier:'req',name:'Bank statement (last 1 to 3 months)',eg:'PDF or CSV, shows pay deposits',feeds:['income','employment'],from:'Applicant'},
  {type:'lease',tier:'ref',name:'Previous lease or landlord letter',eg:'Shows address, rent and dates',feeds:['references'],from:'Applicant'},
  {type:'noa',tier:'opt',name:'CRA Notice of Assessment',eg:'Latest year; useful for self-employed',feeds:['income'],from:'Applicant (CRA My Account)'},
  {type:'t4',tier:'opt',name:'T4 slip',eg:'Latest tax year',feeds:['income'],from:'Applicant'},
  {type:'osb',tier:'opt',name:'OSB insolvency search result',eg:'Result you obtained from the federal records search',feeds:['bankruptcy'],from:'You (needs public-records consent)'},

  {type:'police',tier:'opt',name:'Police record check',eg:'Check the applicant obtained, only if they offer it',feeds:['police'],from:'Applicant (needs their consent)'}

function docListState(s){
  const D=s.docs||[];
  return DOC_LIST.map(r=>{
    const mine=D.filter(d=>d.type===r.type); const altHave=(r.alt||[]).some(a=>D.some(d=>d.type===a));
    const low=mine.some(d=>docLow(s,d));
    const tier=r.tier==='ref'?(s.criteria&&s.criteria.refRequired?'req':'rec'):r.tier;
    return Object.assign({},r,{tier,count:mine.length,have:mine.length>0,altHave,low});
  });
}
const DOCLIST_TIER={req:'Needed',rec:'Recommended',opt:'Optional'};

  const short={id:'Photo ID',credit:'Credit report',paystub:'Paystubs',letter:'Employment letter',bank:'Bank statement',lease:'Previous lease or landlord letter',noa:'Notice of Assessment',t4:'T4 slip',osb:'Insolvency search result',court:'Court search result',police:'Police record check'};
  const detail=r=>{ const D=(s.docs||[]).filter(d=>d.type===r.type); if(!D.length) return r.altHave?'covered':'added'; const f=D[0].f||{}; const n=D.length>1?D.length+' files · ':'';
    const m={id:()=>f.expiry?'expires '+f.expiry:'', paystub:()=>{ const ds=D.map(d=>d.f.payDate).filter(Boolean).sort(); return ds.length?'latest '+ds[ds.length-1]:''; }, credit:()=>(f.score!=null?'score '+f.score:'')+(f.reportDate?' · '+f.reportDate:''), bank:()=>f.periodStart?f.periodStart+' to '+f.periodEnd:'', letter:()=>f.employer||'', lease:()=>f.end?'ends '+f.end:'', noa:()=>f.year?'tax year '+f.year:'', t4:()=>f.year?'tax year '+f.year:'', osb:()=>(RESULT_LABEL[f.result]||'')+(f.date?' · '+f.date:''), court:()=>(RESULT_LABEL[f.result]||'')+(f.date?' · '+f.date:''), police:()=>(RESULT_LABEL[f.result]||'')+(f.date?' · '+f.date:'')};
    const x=(m[r.type]||(()=>''))(); return n+(x||'added'); };
  const row=r=>{ const ok=r.have||r.altHave; const dot=`<span style="display:inline-flex;flex:none;width:18px;height:18px;border-radius:50%;border:2px solid ${ok?(r.low?'var(--amber)':'var(--green)'):'var(--line)'};background:${ok?(r.low?'var(--amber)':'var(--green)'):'#fff'};color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center">${ok?(r.low?'!':'✓'):''}</span>`;
    const uploadBtn=`<label style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;font-size:12px;font-weight:600;border:1px solid var(--ink);border-radius:3px;cursor:pointer;background:${ok?'transparent':'var(--ink)'};color:${ok?'var(--ink)':'#F8F5EF'};white-space:nowrap;flex-shrink:0">${ok?'Replace':'Upload'}<input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,application/pdf,image/*" style="display:none" onchange="readDocFiles(this.files,'${r.type}');this.value=''"></label>`;
    return `<li style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)">${dot}<span style="${ok?'':'font-weight:600'};flex:1;min-width:0">${esc(short[r.type]||r.name)}</span><span class="hint" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px">${ok?(r.low?'check it · ':'')+esc(detail(r)):esc(r.feeds.map(k=>DIM_NAME[k]).join(', '))}</span>${uploadBtn}</li>`; };
  return `<div class="doclist" style="margin:10px 0 14px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:10px 12px">

async function webLookup(name,city){

const LISTING_RX=/linkedin\.com\/company|canada411|yellowpages|bbb\.org|opencorporates|ised-isde|ic\.gc\.ca|dnb\.com|zoominfo|glassdoor|indeed\.com\/cmp|wikidata|wikipedia|openstreetmap|google\.[a-z.]+\/maps/i;

    return {title:r.title||'',url:r.url||'',snippet:String(r.snippet||'').slice(0,160),host,nameHit,domainHit,listing:LISTING_RX.test(r.url||''),

function prelimEvaluate(s,web,inp){

    add('ok',ps.length+' payslip'+(ps.length>1?'s':'')+' read');
    const bad=ps.some(d=>(d.notes||[]).some(n=>n.lvl==='bad'));
    add(bad?'bad':'ok',bad?'Payslip arithmetic does not add up':'Payslip arithmetic is consistent (gross, deductions, net, year to date)'); if(bad) hard=true; else pts+=15;
    const pps=ps.map(d=>payrollPlausibility(d.f));
